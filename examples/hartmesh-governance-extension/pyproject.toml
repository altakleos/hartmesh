[project]
name = "hartmesh-governance-extension"
version = "0.1.0"
description = "Standalone tenant-aware HartMesh governance extension template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.13.0,<0.14"]

[project.entry-points."deerflow.extensions"]
governance = "hartmesh_governance_extension:install"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hartmesh_governance_extension"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["hartmesh_governance_extension"]

[tool.uv.sources]
deerflow-extension-api = { path = "../../backend/packages/extension-api", editable = true }
