name: Docker acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: Production Docker acceptance
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare pinned browser test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          cd frontend-hm
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps
      - name: Build and exercise isolated production stack
        run: python3 scripts/docker_acceptance.py --artifacts /tmp/hartmesh-docker-acceptance
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-acceptance
          path: /tmp/hartmesh-docker-acceptance
          retention-days: 7
