name: Compose instances

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compose-instances-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-instances:
    name: Storage and agents in the Compose bundle (Linux Docker)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      C: docker compose --project-directory /opt/hartmesh --env-file /srv/hartmesh/.env
      EVIDENCE: ${{ github.workspace }}/bundle-evidence
    steps:
      - uses: actions/checkout@v6

      - name: 1 Require Docker Engine 28 or later
        run: |
          version=$(docker version --format '{{.Server.Version}}')
          echo "Docker Engine $version; $(docker compose version)"
          test "${version%%.*}" -ge 28

      - name: 2 Free disk space and check the data directory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          TMPDIR="${RUNNER_TEMP}/hartmesh-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export TMPDIR
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          mkdir -p "$TMPDIR"
          case "$(findmnt -no FSTYPE --target "$TMPDIR")" in tmpfs|ramfs) echo "full-suite temporary directory must be disk-backed"; exit 1 ;; esac
          sudo mkdir -p /srv/hartmesh
          test "$(findmnt -no FSTYPE --target /srv/hartmesh)" = ext4
          test "$(findmnt -no PROPAGATION --target /srv/hartmesh)" = shared
          test "$(df --output=avail -BG /srv/hartmesh | tail -n 1 | tr -dc 0-9)" -ge 30
          command -v mkfs.ext4 e2fsck resize2fs losetup mount umount findmnt fallocate nsenter flock jq
          test -c /dev/loop-control
          test "$(uname -r | cut -d. -f1)" -ge 6

      - name: 3 Register the runtime alias hartmesh-ci
        run: |
          runc_path=$(command -v runc)
          sudo test -f /etc/docker/daemon.json || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq --arg path "$runc_path" '.runtimes["hartmesh-ci"] = {path: $path}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | jq -e 'has("hartmesh-ci")'
          test "$(docker info --format '{{.DefaultRuntime}}')" = runc

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"

      - name: 4 Prepare the backend test environment
        working-directory: backend
        run: uv sync --group dev

      - name: 5 Start the scripted model
        run: |
          mkdir -p "$EVIDENCE"
          nohup python3 docker/acceptance/provider.py > "$EVIDENCE/provider.log" 2>&1 &
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 0.5; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/health

      - name: 6 Build the backend image from this commit
        run: docker build --build-arg UV_EXTRAS=postgres --tag localhost/hartmesh-backend:ci --file backend/Dockerfile .

      - name: 7 Give the image a digest reference
        run: |
          docker run -d --name ci-registry -p 127.0.0.1:80:5000 registry:2
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1/v2/ && break; sleep 0.5; done
          docker push localhost/hartmesh-backend:ci
          backend_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost/hartmesh-backend:ci)
          case "$backend_ref" in localhost/hartmesh-backend@sha256:*) ;; *) echo "unexpected reference: $backend_ref"; exit 1 ;; esac
          echo "BACKEND_REF=$backend_ref" >> "$GITHUB_ENV"
          docker run --rm --entrypoint sh "$backend_ref" -c 'set -eu; command -v nsenter; command -v setpriv'

      - name: 8 Install the bundle at /opt/hartmesh with the built image
        run: |
          sudo mkdir -p /opt/hartmesh
          sudo cp -R deploy/compose/. /opt/hartmesh/
          sudo find /opt/hartmesh -type d -exec chmod 0755 {} +
          sudo find /opt/hartmesh -type f -exec chmod 0644 {} +
          sudo sed -i -E "s#ghcr\.io/altakleos/hartmesh-backend@sha256:[0-9a-f]{64}#${BACKEND_REF}#g" /opt/hartmesh/compose.yaml
          test "$(grep -c -F "$BACKEND_REF" /opt/hartmesh/compose.yaml)" = 3
          if grep -q 'ghcr.io/altakleos/hartmesh-backend@' /opt/hartmesh/compose.yaml; then exit 1; fi

      - name: 9 Write the data directory, the model file and the .env contract
        run: |
          sudo install -d -o 1000 -g 1000 -m 0750 /srv/hartmesh/postgres /srv/hartmesh/redis /srv/hartmesh/home /srv/hartmesh/uploads /srv/hartmesh/artifacts
          sudo install -d -m 0755 /srv/hartmesh/operator /srv/hartmesh/operator/tenant
          sudo tee /srv/hartmesh/operator/models.yaml >/dev/null <<'YAML'
          models:
            - name: acceptance-model
              display_name: Acceptance Model
              use: langchain_openai:ChatOpenAI
              model: acceptance-model
              api_key: $ACCEPTANCE_API_KEY
              base_url: http://host.docker.internal:8080/v1
              max_retries: 0
          YAML
          sudo tee /srv/hartmesh/.env >/dev/null <<'ENV'
          HARTMESH_TENANT=ci
          HARTMESH_PUBLIC_HOST=localhost
          HARTMESH_TRUSTED_PROXIES=127.0.0.1
          HARTMESH_LISTEN=127.0.0.1:2026
          HARTMESH_DATA_DIR=/srv/hartmesh
          SANDBOX_RUNTIME=hartmesh-ci
          SANDBOX_EGRESS=allowlist
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          AUTH_JWT_SECRET=ci-session-signing-secret-of-at-least-32-characters
          HARTMESH_LOCAL_PASSWORDS=allowed
          HARTMESH_LOCAL_REGISTRATION=open
          HARTMESH_MODELS_FILE=/srv/hartmesh/operator/models.yaml
          ACCEPTANCE_API_KEY=synthetic-local-only
          HARTMESH_USERS=3
          HARTMESH_USER_STORAGE_GIB=1
          HARTMESH_AI_ASSISTANTS_PER_USER=1
          HARTMESH_AI_ASSISTANT_STORAGE_GIB=1
          HARTMESH_AI_EMPLOYEES=2
          HARTMESH_AI_EMPLOYEE_STORAGE_GIB=1
          HARTMESH_COMPANY_STORAGE_GIB=1
          ENV
          sudo chmod 0644 /srv/hartmesh/.env /srv/hartmesh/operator/models.yaml

      - name: 10 Ask the shipped one-shot whether the keys fit, before anything exists
        run: |
          $C pull --quiet
          $C run --rm -T storage-init status | tee "$EVIDENCE/status-before.json"
          tail -n 1 "$EVIDENCE/status-before.json" | jq -e '.command == "status" and .returncode == 0 and .inventory == false and (.spaces | length) == 0 and .fits == true and .data_disk.propagation == "shared" and .required_bytes == 9663676416 and .plan.user.count == 3 and .plan.assistant.count == 3 and .plan.employee.count == 2 and .plan.company.count == 1'

      - name: 11 Start the bundle, whose first start prepares every Space
        run: |
          trap '$C logs --no-color gateway storage-init >&2 || true' ERR
          $C up -d --wait
          test "$(docker inspect --format '{{.State.Health.Status}}' hartmesh-gateway-1)" = healthy
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' hartmesh-storage-init-1)" = "exited 0"
          $C logs --no-log-prefix storage-init > "$EVIDENCE/storage-init.log" 2>&1
          test "$(grep -c '^storage-init: prepared ' "$EVIDENCE/storage-init.log")" = 9
          tail -n 1 "$EVIDENCE/storage-init.log" | jq -e '.command == "prepare" and .returncode == 0 and .verdict == "complete" and .fits == true and .prepared == {"user": 3, "assistant": 3, "employee": 2, "company": 1} and .prepared_now == .prepared and (.missing | add) == 0 and (.spaces | length) == 9 and .fstab.entries == 9 and (.problems | length) == 0'
          sudo jq -e '.schema_version == 2 and ([.volumes[].kind] | sort) == ["assistant", "assistant", "assistant", "company", "employee", "employee", "user", "user", "user"] and all(.volumes[]; .max_bytes == 1073741824 and .max_inodes == 131072)' /srv/hartmesh/spaces/inventory.v2.json
          test "$(sudo stat -c '%U:%g %a' /srv/hartmesh/spaces)" = "root:1000 750"
          test "$(sudo stat -c '%u:%g %a' /srv/hartmesh/spaces/inventory.v2.json)" = "1000:1000 440"
          test "$(findmnt -rn -o TARGET | grep -c '^/srv/hartmesh/spaces/.*\.volume$')" = 9
          test "$(sed -n '/^# hartmesh-storage begin$/,/^# hartmesh-storage end$/p' /etc/fstab | grep -c '\.img ')" = 9
          test "$($C exec -T --user 1000:1000 gateway grep -c ' /srv/hartmesh/spaces/' /proc/self/mountinfo)" = 9
          $C logs --no-log-prefix gateway > "$EVIDENCE/gateway-start.log" 2>&1
          grep -F 'storage: storage-init mount-all exit 0 in ' "$EVIDENCE/gateway-start.log" | grep -F '(9 spaces: 0 mounted now, 9 already mounted, 0 failed)'
          grep -F 'storage: ready (9 spaces prepared, 9 verified; users 0 of 3 seats' "$EVIDENCE/gateway-start.log" | grep -F 'runtime hartmesh-ci)'
          grep -F 'storage: company space created (' "$EVIDENCE/gateway-start.log"
          curl -fsS http://127.0.0.1:2026/health | jq -e '.storage == "ready" and (.agents == "none" or .agents == "ready")'
          test "$($C exec -T gateway id -u):$($C exec -T --user 1000 gateway id -u):$($C exec -T --user 1000 gateway id -g)" = "0:1000:0"

      - name: 12 Run prepare by hand, which finds nothing to do
        run: |
          $C run --rm -T storage-init prepare | tee "$EVIDENCE/prepare-again.json"
          tail -n 1 "$EVIDENCE/prepare-again.json" | jq -e '.command == "prepare" and .returncode == 0 and .verdict == "nothing-to-do" and (.prepared_now | add) == 0 and .prepared == {"user": 3, "assistant": 3, "employee": 2, "company": 1} and .fstab.changed == false and (.problems | length) == 0'

      - name: 13 Run the acceptance tests
        working-directory: backend
        run: |
          env PYTHONPATH="$PWD" PYTHON_DOTENV_DISABLED=1 \
            HARTMESH_REQUIRE_BUNDLE_INSTANCES=1 \
            HARTMESH_BUNDLE_URL=http://127.0.0.1:2026 \
            HARTMESH_BUNDLE_PROJECT_DIR=/opt/hartmesh \
            HARTMESH_BUNDLE_ENV_FILE=/srv/hartmesh/.env \
            HARTMESH_BUNDLE_ADMIN_EMAIL=admin@example.com \
            HARTMESH_BUNDLE_ADMIN_PASSWORD='Acceptance-Admin-2026!' \
            HARTMESH_BUNDLE_RUNTIME=hartmesh-ci \
            "$PWD/.venv/bin/python" -m pytest tests/test_compose_instance_acceptance.py \
            --maxfail=1 -q --tb=short -p no:randomly --basetemp="$TMPDIR/fixtures" --junitxml="$EVIDENCE/acceptance.xml"
          python - "$EVIDENCE/acceptance.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          cases = tree.findall(".//testcase")
          assert len(cases) == 10, f"expected 10 acceptance cases, collected {len(cases)}"
          expected = {'test_my_files_shared_and_projects_work_with_storage_spaces_on', 'test_seat_is_taken_at_the_three_creation_paths_and_refused_past_the_count', 'test_release_seat_frees_the_seat_and_empties_the_users_space', 'test_publication_records_the_member_and_by_host', 'test_full_user_space_refuses_upload_and_new_conversation_with_files_full', 'test_chat_without_files_mounts_nothing_of_the_user', 'test_ordinary_chat_works_with_storage_spaces_on', 'test_pool_verifies_inside_the_gateway_container_without_host_image_path', 'test_company_grant_is_written_for_an_account_that_had_none', 'test_chat_without_shared_mounts_the_users_space_alone'}
          names = [case.get("name") for case in cases]
          assert len(names) == len(set(names)) and set(names) == expected, "acceptance names differ from the ten storage cases"
          assert not tree.findall(".//skipped"), "an acceptance case was skipped"
          assert not tree.findall(".//failure") and not tree.findall(".//error")
          PY

      - name: 14 Check that the stack stops cleanly
        run: |
          $C logs --no-color > "$EVIDENCE/compose-before-down.log" 2>&1
          $C ps -a > "$EVIDENCE/services-before-down.txt"
          $C down
          docker rm -f $(docker ps -aq --filter name=hartmesh-space- --filter name=deer-flow-sandbox- --filter name=deer-flow-netproxy-) 2>/dev/null || true
          docker rm -f $(docker ps -aq --filter label=hartmesh.storage.probe) 2>/dev/null || true
          $C run --rm -T storage-init quiesce | tee "$EVIDENCE/quiesce.json"
          tail -n 1 "$EVIDENCE/quiesce.json" | jq -e '.command == "quiesce" and .returncode == 0 and (.unmounted | length) == 9 and (.busy | length) == 0 and (.holders | length) == 0'
          test "$(findmnt -rn -o TARGET | grep -c '^/srv/hartmesh/spaces/' || true)" = 0

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$EVIDENCE"
          $C logs --no-color > "$EVIDENCE/compose.log" 2>&1 || true
          docker ps -a --no-trunc > "$EVIDENCE/containers.txt" 2>&1 || true
          sudo cat /etc/fstab > "$EVIDENCE/fstab.txt" || true
          sudo cat /srv/hartmesh/spaces/inventory.v2.json > "$EVIDENCE/inventory.v2.json" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-instances-${{ github.run_attempt }}
          path: ${{ github.workspace }}/bundle-evidence
          retention-days: 14
