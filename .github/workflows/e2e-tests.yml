name: E2E Tests

on:
  push:
    branches: [ 'main', '*-dev' ]
    paths:
      - 'frontend-hm/**'
      - 'scripts/pnpm.py'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend-hm/**'
      - 'scripts/pnpm.py'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The bookmark browser test starts the real Python action/router fixture.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Keep aligned with backend/Dockerfile and other backend workflows.
          version: "0.11.1"

      - name: Install backend dependencies (bookmark plugin gateway)
        working-directory: backend
        run: uv sync --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        working-directory: frontend-hm
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend-hm
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend-hm
        run: pnpm exec playwright test
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Run auth recovery E2E tests
        working-directory: frontend-hm
        run: pnpm exec playwright test -c playwright.auth.config.ts
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend-hm/playwright-report/
          retention-days: 7
