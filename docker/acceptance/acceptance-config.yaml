log_level: warning
models:
  - name: acceptance-model
    display_name: Acceptance Model
    use: langchain_openai:ChatOpenAI
    model: acceptance-model
    api_key: synthetic-local-only
    base_url: http://provider:8080/v1
    max_retries: 0
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  # Synthetic producers run only inside this disposable Gateway container.
  # This exercises local functionality; AIO read-only mounts qualify isolation.
  allow_host_bash: true
skills:
  path: /data/skills
  container_path: /mnt/skills
tool_groups:
  - name: file:read
  - name: file:write
  - name: bash
tools:
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool
customer_administration:
  plugin_management: false
  local_skill_management: true
  local_mcp_management: false
ui:
  profile: business
  starters: []
memory:
  enabled: false
  injection_enabled: false
summarization:
  enabled: false
agents_api:
  enabled: true
database:
  backend: $ACCEPTANCE_DATABASE_BACKEND
  sqlite_dir: /data/db
  postgres_url: $ACCEPTANCE_DATABASE_URL
stream_bridge:
  type: $ACCEPTANCE_STREAM_BACKEND
auth:
  local:
    lockout_store: $ACCEPTANCE_LOCKOUT_STORE
