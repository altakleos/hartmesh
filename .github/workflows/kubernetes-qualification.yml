name: Kubernetes Durable Invocation Qualification

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: Gateway OCI repository without tag or digest
        required: true
        type: string
      image_digest:
        description: Exact Gateway sha256 digest
        required: true
        type: string
      provisioner_image_repository:
        description: Provisioner OCI repository without tag or digest
        required: true
        type: string
      provisioner_image_digest:
        description: Exact Provisioner sha256 digest
        required: true
        type: string
      sandbox_image_repository:
        description: AIO sandbox OCI repository without tag or digest
        required: true
        type: string
      sandbox_image_digest:
        description: Exact AIO sandbox sha256 digest
        required: true
        type: string
      rwx_storage_class:
        description: StorageClass providing ReadWriteMany volumes
        required: true
        type: string
      kube_context:
        description: Explicit disposable-cluster context to confirm
        required: true
        type: string
      namespace:
        description: Fresh namespace beginning hartmesh-qualification-
        required: true
        type: string
      qualification_id:
        description: Stable safe identifier for this qualification run
        required: true
        type: string
      cluster_driver:
        description: Optional operator-reported cluster driver (kind, k3d, k3s, other)
        required: false
        type: string

permissions:
  contents: read

jobs:
  qualify-one-replica-pod-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEERFLOW_TEST_KUBERNETES: "1"
      DEERFLOW_TEST_KUBERNETES_CONTEXT: ${{ inputs.kube_context }}
      DEERFLOW_TEST_KUBERNETES_CONFIRM_CONTEXT: ${{ inputs.kube_context }}
      DEERFLOW_TEST_KUBERNETES_NAMESPACE: ${{ inputs.namespace }}
      DEERFLOW_TEST_KUBERNETES_QUALIFICATION_ID: ${{ inputs.qualification_id }}
      DEERFLOW_TEST_KUBERNETES_DRIVER: ${{ inputs.cluster_driver }}
      DEERFLOW_TEST_KUBERNETES_SCOPE: "durable_one_replica_rwx_verified_copy_v2_nonempty_skill"
      DEERFLOW_TEST_GATEWAY_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      DEERFLOW_TEST_GATEWAY_IMAGE_DIGEST: ${{ inputs.image_digest }}
      DEERFLOW_TEST_PROVISIONER_IMAGE_REPOSITORY: ${{ inputs.provisioner_image_repository }}
      DEERFLOW_TEST_PROVISIONER_IMAGE_DIGEST: ${{ inputs.provisioner_image_digest }}
      DEERFLOW_TEST_VERIFIER_IMAGE_REPOSITORY: ${{ inputs.provisioner_image_repository }}
      DEERFLOW_TEST_VERIFIER_IMAGE_DIGEST: ${{ inputs.provisioner_image_digest }}
      DEERFLOW_TEST_SANDBOX_IMAGE_REPOSITORY: ${{ inputs.sandbox_image_repository }}
      DEERFLOW_TEST_SANDBOX_IMAGE_DIGEST: ${{ inputs.sandbox_image_digest }}
      DEERFLOW_TEST_KUBERNETES_RWX_STORAGE_CLASS: ${{ inputs.rwx_storage_class }}
      DEERFLOW_TEST_KUBERNETES_EVIDENCE: ${{ github.workspace }}/artifacts/kubernetes-qualification.json

    steps:
      - name: Checkout exact chart and harness
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"

      - name: Install Helm CLI for the opt-in job
        uses: azure/setup-helm@v4.3.1

      - name: Install kubectl CLI for the opt-in job
        uses: azure/setup-kubectl@v4.0.1

      - name: Configure isolated kubeconfig path
        run: printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/qualification-kubeconfig" >> "$GITHUB_ENV"

      - name: Materialize the explicitly supplied disposable-cluster config
        env:
          QUALIFICATION_KUBECONFIG_B64: ${{ secrets.QUALIFICATION_KUBECONFIG_B64 }}
        run: |
          test -n "$QUALIFICATION_KUBECONFIG_B64"
          umask 077
          printf '%s' "$QUALIFICATION_KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"

      - name: Install existing backend test dependencies
        working-directory: backend
        run: uv sync --group dev --extra postgres

      - name: Run every real-pod fault scenario
        working-directory: backend
        run: PYTHONPATH=. uv run pytest -m kubernetes_contract -v -s

      - name: Publish bounded evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kubernetes-qualification-${{ inputs.qualification_id }}
          if-no-files-found: error
          path: |
            artifacts/kubernetes-qualification.json
            artifacts/kubernetes-qualification.failure-artifacts/
