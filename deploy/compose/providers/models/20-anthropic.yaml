# Included when ANTHROPIC_API_KEY is present. From config.example.yaml.
# Claude Sonnet 5.5 thinks by default and rejects extended thinking
# (budget_tokens), thinking type disabled, temperature, top_p and top_k, so the
# entry declares no thinking templates. max_tokens covers thinking and answer.
env: ANTHROPIC_API_KEY
models:
  - name: claude-sonnet-5-5
    display_name: Claude Sonnet 5.5
    use: langchain_anthropic:ChatAnthropic
    model: claude-sonnet-5-5
    api_key: $ANTHROPIC_API_KEY
    default_request_timeout: 600.0
    max_retries: 2
    max_tokens: 16000
    context_window: 200000
    supports_vision: true
