# Included when ATLASCLOUD_API_KEY is present. From config.example.yaml.
env: ATLASCLOUD_API_KEY
models:
  - name: atlascloud-deepseek-v3.2
    display_name: DeepSeek V3.2 (Atlas Cloud)
    use: langchain_openai:ChatOpenAI
    model: deepseek-ai/DeepSeek-V3.2-Exp
    api_key: $ATLASCLOUD_API_KEY
    base_url: https://api.atlascloud.ai/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 8192
    temperature: 0.7
    supports_vision: false
  - name: atlascloud-qwen3-thinking
    display_name: Qwen3 235B Thinking (Atlas Cloud)
    use: deerflow.models.patched_openai:PatchedChatOpenAI
    model: qwen/qwen3-235b-a22b-thinking-2507
    api_key: $ATLASCLOUD_API_KEY
    base_url: https://api.atlascloud.ai/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 8192
    supports_thinking: true
    supports_vision: false
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled
