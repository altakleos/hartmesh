# DeerFlow Helm chart values
#
# Copy to my-values.yaml, edit, and install with:
#   helm install deer-flow deploy/helm/deer-flow -n deer-flow --create-namespace -f my-values.yaml

# -- Optional release namespace override. Empty uses Helm's `--namespace` value.
namespace: ""

# -- Namespace for provisioner-created sandbox resources. Empty uses the
#    resolved release namespace. A non-empty namespace must already exist.
sandboxNamespace: ""

# -- Server-owned tenant identity. Durable profiles require an explicit
#    non-local lowercase DNS label. Empty local renders omit the identity env
#    override; the application and Redis projections use the documented local
#    identity. Never derive this value from a Helm release or namespace.
tenant:
  id: ""
  # -- Exact legacy prefixes recorded by `deerflow deployment bind-tenant`.
  #    These declarations never select a prefix by themselves: the matching
  #    redis.keyPrefixes field must also request it, and Gateway startup checks
  #    the database binding record before opening Redis.
  legacyRedisPrefixes:
    streamBridge: ""
    checkpointCache: ""
    sandboxOwnership: ""

# -- Legacy shared image settings. Existing values files using registry/tag and
#    the three image-name keys remain supported. New deployments should use the
#    per-workload repository/tag/digest values below.
image:
  registry: ""
  tag: "latest"
  pullPolicy: IfNotPresent
  # -- Existing image pull secrets, e.g. [{ name: regcred }]
  pullSecrets: []

  # Image names match what .github/workflows/container.yaml publishes on GHCR
  # as ${repository}-<name> (e.g. ghcr.io/<owner>/deer-flow-backend). Set
  # `registry` to the owner prefix (e.g. ghcr.io/<owner>) and `tag` to consume
  # the published images.
  gatewayImage: deer-flow-backend
  frontendImage: deer-flow-frontend
  provisionerImage: deer-flow-provisioner

# -- Helm-side deployment declaration. local_evaluation keeps tag-based images
#    and explicit unqualified state convenient. Durable modes enable
#    fail-closed render validation for their exact topology contracts.
deployment:
  mode: local_evaluation       # local_evaluation | durable_one_replica | durable_two_gateway_v1
  persistenceTier: shared_durable  # process_local | node_durable | shared_durable
  topology:
    # -- Credential-free reference to the exact PostgreSQL database/schema.
    #    Required only for durable_two_gateway_v1. Generate this outside Helm
    #    as schema:sha256:<64 lowercase hex>; never put a DSN or schema name here.
    databaseSchemaRef: ""
  provenance:
    # -- Optional lowercase source commit/revision (7-64 hex characters).
    sourceRevision: ""
  # -- Operator-declared references to completed external evidence. An empty list
  #    reports unqualified/none_declared; a value reports operator_asserted until
  #    the artifact is independently checked by the offline verifier.
  qualificationEvidence: []
  # - qualificationId: durable-contract-2026-08
  #   artifactDigest: sha256:<64 lowercase hex characters>
  #   completedAt: "2026-08-08T12:00:00Z"
  #   scope: durable_one_replica_pod_recovery
  #   status: passed
  # - qualificationId: two-gateway-2026-09
  #   artifactDigest: sha256:<64 lowercase hex characters>
  #   completedAt: "2026-09-01T12:00:00Z"
  #   scope: durable_two_gateway_v1_postgres_redis_aio_rwx
  #   status: passed
  # -- Qualification harness escape hatch. This does not assert qualification,
  #    accepts no production namespace, and must never receive user traffic.
  qualificationCandidate:
    enabled: false
    id: ""

# -- Expected non-secret extension provenance for the pinned Gateway image and
#    ordered plugins configuration. Calculate configurationDigest with
#    `deerflow extensions config-digest --config <path>`. Both values are
#    required in durable_one_replica when any plugin is enabled and always
#    required as an exact tuple in durable_two_gateway_v1.
extensions:
  artifactManifestDigest: ""
  configurationDigest: ""

# -- Gateway ServiceAccount. The default account has no chart-created RBAC and
#    does not mount an API token. Set create=false/name to select an existing
#    least-privilege account.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# -- Gateway (backend) deployment.
gateway:
  image:
    # -- Full repository without a tag. Empty preserves legacy
    #    image.registry + image.gatewayImage composition.
    repository: ""
    tag: ""
    # -- Optional immutable OCI digest. When set, tag is not rendered.
    digest: ""
  # The chart probes /ready for traffic readiness and keeps /health for
  # process liveness. Required authoritative capability health participates
  # only in readiness; manifest/plugin changes require a pod restart.
  replicas: 1               # Two replicas are opt-in only through the exact
                            # evidence-gated durable_two_gateway_v1 mode.
  autoscaling:
    # -- HPA is outside both qualified durable topology contracts.
    enabled: false
  # Optional explicit override. null derives the grace period from all
  # deployment.shutdown phase budgets + memory flush + preStop + headroom.
  terminationGracePeriodSeconds: null
  # preStop hook sleep (seconds) before SIGTERM, so the Service/ingress
  # deregisters the pod and in-flight HTTP requests drain before graceful
  # shutdown begins (which runs the memory queue drain). 0 disables the hook.
  # Counts against terminationGracePeriodSeconds.
  preStopSleepSeconds: 5
  shutdownSchedulingHeadroomSeconds: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 6
    failureThreshold: 1
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
  # -- Bounded pod metadata (maximum 32 entries each; label values <=63 bytes,
  #    annotation values <=2048 bytes). Chart-owned selector/checksum keys are
  #    reserved and cannot be overridden.
  podLabels: {}
  podAnnotations: {}
  # -- Structured references only. Use secretRef/configMapRef; do not copy raw
  #    secret values into this file.
  extraEnvFrom: []
  # -- Additional Secret or ConfigMap Volume records and matching read-only
  #    VolumeMount records. Mounts apply only to the Gateway container.
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# -- Frontend (Next.js) deployment.
frontend:
  replicas: 1
  image:
    repository: ""
    tag: ""
    digest: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# -- nginx reverse-proxy deployment (preserves compose routing).
nginx:
  replicas: 1
  image:
    repository: nginx
    tag: alpine
    digest: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    # -- Service type fronting nginx. `LoadBalancer` on Docker Desktop / kind /
    #    OrbStack routes to localhost (no Ingress controller needed). `ClusterIP`
    #    pairs with the Ingress resource. `NodePort` exposes on a node port.
    type: ClusterIP
    port: 2026
    loadBalancerIP: ""
    nodePort: ""

# -- Runtime settings for provisioner-created sandbox Pods.
sandbox:
  # -- Set to `gvisor` (or another RuntimeClass) to sandbox under it; leave
  #    empty to use the cluster default runtime.
  runtimeClassName: ""
  # -- Sandbox volume mode (`pvc` or `hostpath`). Empty infers `pvc` only when
  #    both claim names are configured, or `hostpath` when neither is. Kubernetes
  #    deployments should set `pvc` explicitly so missing claims fail startup.
  volumeMode: ""
  # -- Startup probe for provisioner-created sandbox Pods. The 200-second
  #    default budget gives a measured 134-second concurrent gVisor startup 66
  #    seconds of margin; image pulling precedes the container/probe lifecycle.
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 20
  # -- Liveness begins only after startup first succeeds. A 10-second timeout
  #    tolerates the healthy startup tail without changing immediate refusal
  #    detection; three timed-out responses can take up to 61 seconds to kill.
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

# -- Sandbox provisioner (K8s-native code execution). Creates sandbox Pods in
#    this namespace via a ServiceAccount + RBAC.
provisioner:
  enabled: true
  image:
    repository: ""
    tag: ""
    digest: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # -- Audience for the short-lived projected Gateway ServiceAccount token.
  #    The provisioner validates it with Kubernetes TokenReview and binds the
  #    exact Gateway namespace and ServiceAccount name.
  gatewayTokenAudience: hartmesh-provisioner
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # -- AIO-compatible sandbox container image used for sandbox Pods.
  sandboxImage: "ghcr.io/bytedance/deer-flow-sandbox:latest"
  # -- Service type for per-sandbox Services. `ClusterIP` (default) exposes
  #    sandboxes only inside the cluster via Service DNS - correct for the
  #    in-cluster gateway and avoids binding the code-execution surface on
  #    every node's interfaces. `NodePort` is the Docker-Compose/hybrid escape
  #    hatch (used when the gateway is not in K8s); pair with `nodeHost`.
  sandboxServiceType: "ClusterIP"
  # -- Host the gateway uses to reach sandbox NodePorts. Only consulted when
  #    `sandboxServiceType: NodePort`. Empty (default) falls back to the
  #    provisioner pod's node IP via the Kubernetes downward API, which routes
  #    on most clusters because a NodePort is exposed on every node. Set
  #    explicitly only when pod->node-IP traffic is blocked by your
  #    CNI/network policy. In Docker Compose this is `host.docker.internal`.
  nodeHost: ""
  # -- Sandbox container port (must match the sandboxImage's listening port).
  sandboxPort: 8080
  # -- Durable accepted-skill projection. `disabled` keeps remote AIO
  # empty-only. `rwx_verified_copy_v2` copies an exact content-addressed
  # snapshot from an actual RWX shared home PVC into a private per-Pod emptyDir,
  # verifies it, and exposes it read-only through a capability gate. It adds no
  # same-node affinity; sandbox and provisioner images must be digest-pinned.
  acceptedSkillProjectionProfile: "disabled" # disabled | rwx_verified_copy_v2
  acceptedAttempt:
    # -- Native Lease TTL for one accepted-skill sandbox attempt.
    leaseSeconds: 120
    # -- Bounded stale-attempt reconciliation cadence and page size.
    reconcileIntervalSeconds: 30
    reconcileLimit: 100

# -- Application database engine settings.
database:
  # -- Cap temporary ORM overflow connections on a shared PostgreSQL server; unset keeps SQLAlchemy's default.
  poolMaxOverflow: null

# -- PostgreSQL database. Bundled mode (default) deploys a single-instance
#    postgres StatefulSet; set `enabled: false` to use an external managed DB.
#    The gateway reads DATABASE_URL from the resolved Secret and config.yaml
#    references it as $DATABASE_URL in database.postgres_url.
postgresql:
  # -- Deploy a bundled postgres StatefulSet. Disable to use an external DB.
  enabled: true
  image:
    repository: postgres
    tag: "16"
    digest: ""
  auth:
    database: deerflow
    username: deerflow
    # -- Password auto-generated (32 chars, persisted across upgrades) when
    #    empty. Ignored if existingSecret is set. Local evaluation only;
    #    durable_one_replica rejects inline passwords.
    password: ""
  # -- Use an existing Secret (key `database-url`, plus `postgres-password`
  #    in bundled mode) instead of generating one. Skips Secret creation.
  existingSecret: ""
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      enabled: true
      storageClass: ""           # "" = cluster default
      accessMode: ReadWriteOnce  # RWX (NFS) only needed if postgres itself is HA
      size: 20Gi
  # -- External postgres (used when `enabled: false`). Provide either a full
  #    `databaseUrl` (chart wraps it into a Secret for you) or an
  #    `existingSecret` you manage (key `database-url`).
  external:
    # -- Local-evaluation convenience DSN. durable_one_replica rejects inline
    #    URLs and requires external.existingSecret instead.
    databaseUrl: ""
    # -- Secret you manage (key `database-url`). Use this with External Secrets
    #    / Vault / Sealed Secrets so the DSN never appears in values files.
    existingSecret: ""

# -- Redis stream bridge. The gateway stores per-run SSE events in Redis Streams
#    for bounded reconnect replay. Bundled mode (default) deploys
#    a single-instance redis StatefulSet; set `enabled: false` to use an external
#    managed Redis. The gateway reads DEER_FLOW_STREAM_BRIDGE_REDIS_URL from the
#    resolved Secret; config.yaml's stream_bridge.type is `redis` by default.
redis:
  # -- Deploy a bundled redis StatefulSet. Disable to use an external Redis.
  enabled: true
  # -- Compatibility-only outer prefix for the first tenant-identity release.
  #    It must equal the canonical projection or the exact recorded legacy
  #    stream-bridge projection declared under tenant.legacyRedisPrefixes.
  tenantPrefix: ""
  # -- Compatibility-only subsystem prefixes. Each nonempty value must equal
  #    its canonical projection or exact operator-recorded legacy projection.
  keyPrefixes:
    streamBridge: ""
    checkpointCache: ""
    sandboxOwnership: ""
  image:
    repository: redis
    tag: "7-alpine"
    digest: ""
  auth:
    # -- Empty (default) = no auth, matching the compose deployment (ClusterIP
    #    isolation only). Set a password to enable AUTH; the DSN becomes
    #    redis://:<password>@host:6379/0. Ignored if existingSecret is set.
    #    Local evaluation only; durable_one_replica rejects inline passwords.
    password: ""
  # -- Use an existing Secret (key `redis-url`, plus `redis-password` if auth)
  #    instead of generating one. Skips Secret creation.
  existingSecret: ""
  primary:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 512Mi
    persistence:
      enabled: true
      storageClass: ""           # "" = cluster default
      accessMode: ReadWriteOnce  # RWX (NFS) only needed if redis itself is HA
      size: 5Gi
  # -- External redis (used when `enabled: false`). Provide either a full
  #    `redisUrl` (chart wraps it into a Secret for you) or an `existingSecret`
  #    you manage (key `redis-url`).
  external:
    # -- Local-evaluation convenience URL. durable_one_replica rejects inline
    #    URLs and requires external.existingSecret instead.
    redisUrl: ""
    # -- Secret you manage (key `redis-url`). Use with External Secrets / Vault
    #    / Sealed Secrets so the URL never appears in values files.
    existingSecret: ""

# -- Persistent volume for runtime state (.deer-flow): sqlite DB, memory,
#    custom agents, mutable extensions_config.json, and per-thread user-data.
#    Also mounted (PVC mode) into provisioner-spawned sandbox Pods. When
#    disabled, Gateway runtime state uses a pod-local emptyDir instead.
persistence:
  home:
    # -- Keep enabled=true when using an existing claim: enabled=false also
    #    suppresses the provisioner's USERDATA_PVC_NAME environment variable.
    enabled: true
    # -- Existing home PVC name. When set, the chart does not create a PVC;
    #    the Gateway mount and provisioner sandbox user-data both use this claim.
    existingClaim: ""
    storageClass: ""         # "" = cluster default
    accessMode: ReadWriteOnce  # Use ReadWriteMany (NFS/etc.) for multi-node
    size: 10Gi

# -- Skills library mounted at /app/skills. Default: emptyDir (skills disabled).
#    Populate via an existing PVC or ConfigMap, or bake skills into a custom
#    gateway image. Provisioner PVC mode references this same claim when set.
skills:
  enabled: false
  existingClaim: ""
  configMap: ""
  # -- Operator declaration for an existing claim. The chart cannot inspect
  #    its StorageClass; durable_two_gateway_v1 verifies the claim live too.
  accessMode: ""

# -- Local-evaluation convenience for provider/channel/search secrets injected
#    as environment variables. Production values should leave this empty and
#    use existingSecret or gateway.extraEnvFrom references instead.
secrets: {}
# -- Use an existing Secret instead of creating one from `secrets` above.
existingSecret: ""

# -- Ingress in front of nginx (port 2026). nginx preserves all internal routing.
ingress:
  enabled: true
  className: "nginx"
  host: "deer-flow.example.com"
  annotations:
    # Allows a 100 MiB .skill archive plus multipart framing at the outer ingress.
    nginx.ingress.kubernetes.io/proxy-body-size: "101m"
    # Streams request bodies to nginx instead of spooling them at the outer ingress.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Skill validation may perform multiple sequential LLM calls.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  tls:
    enabled: false
    secretName: ""
    # hosts: []   # defaults to [ingress.host]

# -- DeerFlow config.yaml content. Secrets MUST stay as $VAR references — never
#    inline literal secret values here. The default enables provisioner sandbox.
config: |
  config_version: 48
  log_level: info

  models: []
  # Example (uncomment & set the matching secret in `secrets`):
  #   - name: gpt-4
  #     display_name: GPT-4
  #     use: langchain_openai:ChatOpenAI
  #     model: gpt-4
  #     api_key: $OPENAI_API_KEY
  #     request_timeout: 600.0

  sandbox:
    use: deerflow.community.aio_sandbox:AioSandboxProvider
    provisioner_url: http://provisioner:8002
    accepted_skill_projection_profile: disabled
    image: ghcr.io/bytedance/deer-flow-sandbox:latest
    port: 8080
    replicas: 3

  database:
    # PostgreSQL is the default backend (bundled StatefulSet, or external).
    # DATABASE_URL is injected from the postgres Secret; $DATABASE_URL is
    # resolved by the harness before the config is instantiated.
    backend: postgres
    postgres_url: $DATABASE_URL
    pool_recycle: 300
    command_timeout: 30

  # Keyed native ingress uses the application PostgreSQL database for leased
  # receipt rows. In local non-PostgreSQL configurations, auto degrades
  # explicitly to best_effort delivery and the deployment report says so.
  dedupe_storage:
    backend: auto

  # The default chart is an explicitly unqualified local evaluation. Switch
  # both this profile and deployment.mode when adopting the validated durable
  # one-replica profile.
  deployment:
    profile: local_development
    readiness:
      capability_cache_seconds: 10.0
      admission_health_max_age_seconds: 10.0
      required_health_stale_seconds: 30.0
      capability_probe_timeout_seconds: 2.0
      overall_timeout_seconds: 5.0
      required_failure_threshold: 1
    shutdown:
      admission_seconds: 2.0
      channel_seconds: 5.0
      scheduler_seconds: 3.0
      run_seconds: 8.0
      dependencies_seconds: 5.0

  # The LangGraph Store (cross-thread memory + thread list) reads this legacy
  # `checkpointer:` section — it does NOT fall back to `database:` the way the
  # checkpointer does. Point it at the same postgres so durable checkpoints and
  # the Store survive a Gateway restart.
  checkpointer:
    type: postgres
    connection_string: $DATABASE_URL

  # Stream bridge: `redis` (default) stores per-run SSE events in Redis Streams
  # for reconnect replay. The URL is read from the
  # DEER_FLOW_STREAM_BRIDGE_REDIS_URL env var injected from the redis Secret.
  # Set `type: memory` (and disable the redis chart) for single-pod-only mode.
  stream_bridge:
    type: redis

  memory:
    storage_path: memory.json

  verification:
    receipts_enabled: true
    receipts_render_mode: "delegation_only"
    judge_enabled: false
    judge_model_name: null

  # -- Tools configuration. The agent gets NO tools unless they're listed here
  # (BUILTIN_TOOLS only adds present_file + ask_clarification). The file/bash
  # tools run inside the AIO sandbox configured above. The web tools
  # (web_search, web_fetch, image_search) need no API key but require outbound
  # internet from the gateway pod - swap backends or remove entries for
  # air-gapped clusters (see config.example.yaml).
  tool_groups:
    - name: web
    - name: file:read
    - name: file:write
    - name: bash
    # - name: knowledge  # Enable with the RAGFlow tool below.

  tools:
    # Optional tenant-shared, read-only RAGFlow retrieval. Put RAGFLOW_API_KEY
    # in `secrets`. `datasets` is an optional stable-ID allowlist; omit it to
    # search all tenant-visible datasets. An explicit empty list is invalid.
    # Empty datasets are skipped; remaining
    # datasets are grouped by embedding model with up to four parallel retrieval
    # requests and one global `page_size` limit. Multi-group scores are omitted
    # because they are not comparable. The Agent cannot see the IDs.
    # - name: knowledge_search
    #   group: knowledge
    #   use: deerflow.community.ragflow.tools:knowledge_search_tool
    #   base_url: http://ragflow:9380
    #   api_key: $RAGFLOW_API_KEY
    #   datasets:  # Optional operator-controlled allowlist
    #     - 0123456789abcdef0123456789abcdef
    #   timeout: 30
    #   page_size: 8
    #   similarity_threshold: 0.2
    #   vector_similarity_weight: 0.3
    #   top_k: 256
    #   max_chars_per_chunk: 800
    #   max_total_chars: 8000
    - name: web_search
      group: web
      use: deerflow.community.ddg_search.tools:web_search_tool
      max_results: 5
    - name: web_fetch
      group: web
      use: deerflow.community.jina_ai.tools:web_fetch_tool
      timeout: 10
    - name: image_search
      group: web
      use: deerflow.community.image_search.tools:image_search_tool
      max_results: 5
    - name: ls
      group: file:read
      use: deerflow.sandbox.tools:ls_tool
    - name: read_file
      group: file:read
      use: deerflow.sandbox.tools:read_file_tool
    - name: glob
      group: file:read
      use: deerflow.sandbox.tools:glob_tool
      max_results: 200
    - name: grep
      group: file:read
      use: deerflow.sandbox.tools:grep_tool
      max_results: 100
    - name: write_file
      group: file:write
      use: deerflow.sandbox.tools:write_file_tool
    - name: str_replace
      group: file:write
      use: deerflow.sandbox.tools:str_replace_tool
    - name: bash
      group: bash
      use: deerflow.sandbox.tools:bash_tool

# -- Initial DeerFlow extensions_config.json content (MCP servers + skill
#    state). The Gateway copies this ConfigMap seed into its writable home
#    volume only when no runtime file exists. With persistence enabled, API
#    updates and the original seed survive pod replacement and Helm upgrades;
#    remove the runtime file explicitly if a later seed should replace it.
extensionsConfig: |
  {"mcpServers":{},"skills":{}}
