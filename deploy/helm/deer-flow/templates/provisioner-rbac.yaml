{{- if .Values.provisioner.enabled -}}
{{- if .Values.provisioner.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deer-flow.provisionerServiceAccountName" . }}
  namespace: {{ include "deer-flow.namespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
  {{- with .Values.provisioner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# Namespaced permissions: manage sandbox resources in the sandbox namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner
  namespace: {{ include "deer-flow.sandboxNamespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
rules:
  # Verbs mirror docker/provisioner/app.py. They still apply to every resource
  # of each kind in the sandbox namespace because RBAC cannot scope by label.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "delete", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner
  namespace: {{ include "deer-flow.sandboxNamespace" . }}
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "deer-flow.provisionerServiceAccountName" . }}
    namespace: {{ include "deer-flow.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "deer-flow.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped namespace existence check and authentication. Namespace create
# is deliberately not granted by the chart; operators must pre-create it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner-ns
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ include "deer-flow.sandboxNamespace" . | quote }}]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "deer-flow.fullname" . }}-provisioner-ns
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "deer-flow.provisionerServiceAccountName" . }}
    namespace: {{ include "deer-flow.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "deer-flow.fullname" . }}-provisioner-ns
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
