name: Unit Tests

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default-install-collection:
    # The main job installs --extra postgres; this job proves the documented
    # contributor path (uv sync --group dev, no extras) still collects the
    # whole suite, so optional-dependency imports must stay lazy.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install backend dependencies (documented default)
        working-directory: backend
        run: uv sync --group dev

      - name: Collect backend tests
        working-directory: backend
        run: uv run pytest --collect-only -q

  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deerflow
          POSTGRES_PASSWORD: deerflow
          POSTGRES_DB: deerflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URI: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install backend dependencies
        working-directory: backend
        # The Phase 0 feasibility probe byte-verifies the exact optional SDK.
        # Keep it out of the documented default install job above, but present
        # before the full-suite step so `make test`'s same locked extra
        # selection is a no-op and install failures stay separately attributed.
        run: uv sync --group dev --extra postgres --extra opensandbox

      - name: Qualify PostgreSQL invocation persistence
        working-directory: backend
        env:
          DEERFLOW_TEST_POSTGRES_URL: ${{ env.TEST_POSTGRES_URI }}
        # Keep this visible marker gate even though the full suite below repeats
        # it: this step records PostgreSQL/Alembic identity and isolates failures.
        run: PYTHONPATH=. uv run pytest -m postgres_contract -v -s

      - name: Run unit tests of backend
        working-directory: backend
        env:
          # Expose the job's Postgres service to the cross-pod dedupe integration
          # tests (issue #4120), which read DEDUPE_TEST_POSTGRES_URL. Without this
          # mapping those tests silently skip and the headline capability is never
          # exercised in CI.
          DEDUPE_TEST_POSTGRES_URL: ${{ env.TEST_POSTGRES_URI }}
          # Atomic RunRow admission races use their own explicit gate. Keeping
          # this mapping beside the dedupe gate makes any skip a CI failure of
          # the required capability rather than a silently untested branch.
          DEERFLOW_TEST_POSTGRES_URL: ${{ env.TEST_POSTGRES_URI }}
        run: make test
