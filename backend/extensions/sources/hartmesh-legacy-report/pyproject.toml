[project]
name = "hartmesh-legacy-report"
version = "0.1.0"
description = "Provider-installed presentation and filing compatibility for historical reports"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.5,<0.3"]

[project.entry-points."deerflow.extensions"]
legacy-report = "hartmesh_legacy_report:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hartmesh_legacy_report"]
