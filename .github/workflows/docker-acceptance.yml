name: Docker acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_image:
        description: "Optional backend repository@sha256:digest (requires frontend_image)"
        type: string
      frontend_image:
        description: "Optional frontend repository@sha256:digest (requires backend_image)"
        type: string

concurrency:
  group: docker-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed-storage:
    name: Managed storage hard limits (Linux Docker)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
      - name: Prepare standard backend test environment
        working-directory: backend
        run: uv sync --group dev
      - name: Prepare isolated native writer image
        run: |
          docker pull python:3.12-slim
          writer_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          echo "HARTMESH_STORAGE_WRITER_IMAGE=$writer_ref" >> "$GITHUB_ENV"
      - name: Prepare pinned instance AIO image
        run: |
          instance_image=$(backend/.venv/bin/python -c 'import yaml; print(yaml.safe_load(open("deploy/compose/config.yaml", encoding="utf-8"))["sandbox"]["image"])')
          docker pull "$instance_image"
          echo "HARTMESH_INSTANCE_AIO_IMAGE=$instance_image" >> "$GITHUB_ENV"
      - name: Qualify actual disk, inode, staging and native view limits
        working-directory: backend
        run: |
          task_tmp="${RUNNER_TEMP}/hartmesh-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$task_tmp"
          sudo env PYTHONPATH="$PWD" PYTHON_DOTENV_DISABLED=1 \
            HARTMESH_REQUIRE_MANAGED_STORAGE=1 HARTMESH_STORAGE_WRITER_IMAGE="$HARTMESH_STORAGE_WRITER_IMAGE" \
            HARTMESH_INSTANCE_AIO_IMAGE="$HARTMESH_INSTANCE_AIO_IMAGE" \
            TMPDIR="$task_tmp" "$PWD/.venv/bin/python" -m pytest \
            tests/test_storage_spaces_volume_native.py --maxfail=1 -q --tb=short \
            --basetemp="$task_tmp/fixtures" --junitxml="$task_tmp/native.xml"
          python - "$task_tmp/native.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          cases = tree.findall(".//testcase")
          assert len(cases) >= 16, "Required managed-storage and instance AIO cases were not collected"
          assert not tree.findall(".//skipped"), "Managed-storage merge qualification cannot skip"
          assert not tree.findall(".//failure") and not tree.findall(".//error")
          PY
      - name: Upload native qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-storage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hartmesh-storage-${{ github.run_id }}-${{ github.run_attempt }}/native.xml
          if-no-files-found: error
          retention-days: 30
  acceptance:
    name: Production Docker acceptance (${{ matrix.stores }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stores: [sqlite, postgres-redis]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare pinned browser test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          cd frontend-hm
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps
      - name: Exercise isolated production stack
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          ACCEPTANCE_STORES: ${{ matrix.stores }}
        run: |
          args=(--artifacts /tmp/hartmesh-docker-acceptance --stores "$ACCEPTANCE_STORES")
          if [[ -n "$BACKEND_IMAGE" || -n "$FRONTEND_IMAGE" ]]; then
            args+=(--backend-image "$BACKEND_IMAGE" --frontend-image "$FRONTEND_IMAGE")
          fi
          python3 scripts/docker_acceptance.py "${args[@]}"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-acceptance-${{ matrix.stores }}-${{ github.run_attempt }}
          path: /tmp/hartmesh-docker-acceptance
          retention-days: 7
      - name: Upload candidate acceptance result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.backend_image != '' && inputs.frontend_image != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-acceptance-${{ matrix.stores }}-${{ github.run_attempt }}
          path: /tmp/hartmesh-docker-acceptance/result.json
          if-no-files-found: error
          retention-days: 90
