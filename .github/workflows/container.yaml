name: Publish Containers

# Two ways in:
#   * A v* tag push publishes the release images. Components that
#     deploy/compose/images.txt pins to a digest are not rebuilt: the pinned
#     digest is retagged with the release tag (a rebuild would produce a new
#     digest and break the golden VM image's "first start pulls nothing"
#     property). The retag must not re-encode the manifest: `docker buildx
#     imagetools create` wraps a single-platform manifest in a new one-child
#     list and changes the digest (that is how 2.1.0+hartmesh.5 was refused
#     at the identity freeze), so the step uses `crane tag`, which re-pushes
#     the same bytes, and asserts the digest before and after. A tag-form
#     reference in images.txt fails the release.
#   * A workflow_dispatch with the release version builds the candidate
#     images from the dispatched ref under that release's tag spelling, so
#     scripts/pin_compose_images.py can resolve their digests before the tag
#     exists. A dispatch never adopts, whatever pins the tree carries: between
#     cuts it carries the previous release's, and adopting them would ship
#     that release's code as the next one. See RELEASING.md, "Fork release
#     procedure".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example, 2.1.0+hartmesh.5); the dispatched ref must already carry it
        required: true
        type: string

jobs:
  verify-versions:
    # Gate the release: every version source must match the v* tag (or the
    # dispatched version). A forgotten bump in Chart.yaml, pyproject.toml,
    # uv.lock, or package.json fails here and skips every image build. See
    # scripts/verify_versions.sh.
    uses: ./.github/workflows/verify-versions.yml
    with:
      version: ${{ inputs.version || '' }}

  container:
    needs: verify-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            file: backend/Dockerfile
            # Bake the `postgres` extra into the published image so multi-replica
            # deployments (K8s/Helm) can use shared Postgres persistence instead of
            # file-based SQLite. sqlite/redis-only single-replica setups still work;
            # this only adds the Postgres driver. See backend/Dockerfile `UV_EXTRAS`.
            build-args: UV_EXTRAS=postgres
          - component: frontend
            context: .
            file: frontend/Dockerfile
            build-args: ""
          - component: provisioner
            context: docker/provisioner
            file: docker/provisioner/Dockerfile
            build-args: ""
          - component: sandbox
            context: docker/sandbox
            file: docker/sandbox/Dockerfile
            build-args: BASE_IMAGE=ghcr.io/${{ github.repository }}-sandbox-base@sha256:6328d7fd2f0ff0b4c147c3d05b3df1ce331f4a482eb6e550ecd64ed1fcf906e7
          - component: sandbox-network-proxy
            context: .
            file: docker/sandbox-network-proxy/Dockerfile
            build-args: ""
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.component }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - name: Compute the release image tags
        id: identity
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release_tag_spellings.sh "${VERSION#v}" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 #v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Adopt the digest deploy/compose pins for this component
        id: adopt
        env:
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
          SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a tag push adopts. A candidate build (workflow_dispatch) builds
          # every component whatever deploy/compose/images.txt carries: between
          # cuts it carries the previous release's digest pins, and adopting
          # them would publish that release's images under the next version
          # with every downstream check green.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "adopted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPOSITORY="${REGISTRY}/${IMAGE_NAME}"
          PIN="$(grep -E "^${REPOSITORY}@sha256:[0-9a-f]{64}$" deploy/compose/images.txt || true)"
          if [ -z "$PIN" ]; then
            if grep -Eq "^${REPOSITORY}:" deploy/compose/images.txt; then
              echo "::error::deploy/compose/images.txt still references ${REPOSITORY} by tag; run scripts/pin_compose_images.py before tagging the release"
              exit 1
            fi
            echo "adopted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | crane auth login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          if ! crane manifest "$PIN" >/dev/null 2>&1; then
            echo "::error::${PIN} is pinned by deploy/compose/images.txt but is not in the registry; dispatch the candidate build before pinning"
            exit 1
          fi
          media_type() { crane manifest "$1" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("mediaType", ""))'; }
          PIN_DIGEST="${PIN##*@}"
          PIN_MEDIA_TYPE="$(media_type "$PIN")"
          RELEASE_TAG="${REPOSITORY}:${IMAGE_TAG}"
          SHA_TAG="${REPOSITORY}:sha-${SHORT_SHA}"
          # Before: the candidate build under this version is what put the pinned
          # digest at the release tag. Anything else means the candidate was
          # rebuilt after the pins were taken, or the pins are another version's.
          BEFORE="$(crane digest "$RELEASE_TAG" 2>/dev/null || true)"
          if [ "$BEFORE" != "$PIN_DIGEST" ]; then
            echo "::error::${RELEASE_TAG} resolves to ${BEFORE:-nothing}, not the pinned ${PIN_DIGEST}; the candidate build under this version must be what pinned it"
            exit 1
          fi
          echo "Adopting ${PIN}: ${RELEASE_TAG} already resolves to the pin (${BEFORE}, ${PIN_MEDIA_TYPE})" | tee -a "$GITHUB_STEP_SUMMARY"
          # crane tag fetches the manifest by digest and pushes the same bytes
          # under the new tag, so the digest cannot change.
          crane tag "$PIN" "$IMAGE_TAG"
          crane tag "$PIN" "sha-${SHORT_SHA}"
          # After: both tags resolve to the pin, with the pin's media type.
          for REF in "$RELEASE_TAG" "$SHA_TAG"; do
            AFTER="$(crane digest "$REF")"
            AFTER_MEDIA_TYPE="$(media_type "$REF")"
            if [ "$AFTER" != "$PIN_DIGEST" ] || [ "$AFTER_MEDIA_TYPE" != "$PIN_MEDIA_TYPE" ]; then
              echo "::error::${REF} resolves to ${AFTER} (${AFTER_MEDIA_TYPE}) after adoption, not the pinned ${PIN_DIGEST} (${PIN_MEDIA_TYPE})"
              exit 1
            fi
            echo "Adopted ${PIN} as ${REF} without rebuilding: digest ${AFTER} == pin, mediaType ${AFTER_MEDIA_TYPE}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "adopted=true" >> "$GITHUB_OUTPUT"
      - name: Extract metadata (tags, labels) for Docker
        if: steps.adopt.outputs.adopted != 'true'
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 #v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.identity.outputs.image_tag }}
            type=raw,value=sha-${{ steps.identity.outputs.short_sha }}
      - name: Build and push Docker image
        if: steps.adopt.outputs.adopted != 'true'
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}

      - name: Generate artifact attestation
        if: steps.adopt.outputs.adopted != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be #v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
