services:
  postgres:
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    command: ["postgres", "-c", "synchronous_commit=off", "-c", "wal_writer_delay=200ms"]
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 512
  gateway:
    volumes:
      - ${ACCEPTANCE_TITLE_CONFIG:?runner supplies the generated config}:/fixture/config.yaml:ro
      - ./title-search/seed.py:/fixture/seed-title-search.py:ro
