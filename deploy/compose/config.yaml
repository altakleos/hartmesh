# HartMesh tenant VM profile: config.yaml TEMPLATE.
#
# This file is never read by the Gateway directly. gateway/run.sh renders the
# effective config.yaml into the tenant's data directory at every start
# (gateway/render_config.py), pointing DEER_FLOW_CONFIG_PATH at the result:
#
#   - `models:` is filled from providers/models/*.yaml for every provider whose
#     environment variable is present and non-empty in the tenant .env, and
#     `tools:` entries are replaced by providers/tools/*.yaml the same way, so
#     no `$NAME` reference survives for a key the tenant does not carry
#     (`$NAME` expansion is whole-string, secrets-only, and raises on an unset
#     name, which would otherwise be a hard start requirement).
#   - `sandbox.network` is chosen by SANDBOX_EGRESS: the allowlist block below
#     when the key is `allowlist` or absent, `mode: open` alone for `open`;
#     any other value refuses to render.
#
# Everything else is copied through unchanged. Paths are literal because this
# file cannot interpolate them: HARTMESH_DATA_DIR is therefore fixed at
# /srv/hartmesh by this file (README: "Mount points").
config_version: 57
log_level: info

models: []

# ── Local login throttling ──────────────────────────────────────────────────
# The lockout is keyed on the account, not the client address: one tenant is
# one company, five to twenty staff behind one office NAT address, so an
# address-keyed lock made five failures by anyone lock out everyone (README:
# "The .env contract", AUTH_TRUSTED_PROXIES). The counters live in Redis, which
# this profile already runs, so an administrator can clear a lockout through
# POST /api/v1/auth/lockouts/clear without restarting the Gateway — a restart
# here is a visible interruption for everyone still working, because the stack
# is one replica with a recreate rollout. A Redis outage fails login closed;
# on this profile Redis is already load-bearing for streaming.
auth:
  local:
    lockout_store: redis
    # The one number this profile raises. The generic default of 300 total
    # failures per source window is exactly this deployment's design allowance
    # and no more: twenty staff, five wrong attempts each to reach their own
    # account lock, then ten further retries each during it (the response a
    # locked account gets is the one a wrong password gets, by design, so
    # nothing tells a person to stop) is 20 x 15 = 300. A single bad morning
    # would land *on* the limit and lock the office's shared address for
    # 15 minutes. 600 is that allowance doubled, leaving 299 further failures
    # before the limit trips. These are design allowances, not measured
    # behaviour. The tradeoff is explicit in README ("Login lockout"): this
    # source may now cause twice as many counted failures before the volume
    # block, and neither this limit nor the 50-account guard makes an office
    # immune to a malicious user sharing its address.
    source_max_failures: 600

# ── Sandbox: the Gateway's local Docker backend (no provisioner_url) ────────
sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  image: ghcr.io/altakleos/hartmesh-sandbox@sha256:4e0a062feafa53c763188c292560d99e32ff1a889f7764e29e8f851154cdbb43
  port: 8080
  # Concurrent-sandbox ceiling from the memory budget (README: "Memory
  # budget"): two 1 GiB slim sandboxes with their relays sit on the 5.0 GiB
  # line (a 512 MiB slot had no headroom over the sandbox's own idle
  # footprint; README: "Two 1 GiB slots"). This is a soft maximum with LRU
  # eviction of warm sandboxes: a third acquisition evicts the
  # least-recently-used idle sandbox instead of failing; with both in active
  # use the provider logs a soft-cap breach and creates a third, which the
  # guest's unallocated memory absorbs once (README: "Memory budget").
  replicas: 2
  # How long an idle sandbox keeps one of the two slots. The budget reserves
  # every slot whether or not it is used, and a cold start of the sandbox
  # image under gVisor takes tens of seconds, so idle sandboxes are kept warm
  # for 30 minutes; a third thread still evicts the least recently used one.
  idle_timeout: 1800
  # The sandbox image's own service switches, passed to every sandbox as
  # environment by the local Docker backend. Off: the browser and its MCP
  # server, VNC, Jupyter, code-server and the Node REPL (this last one also
  # stops its on-demand start). Left running in the container: the sandbox
  # API server and its nginx (the relay is a separate sidecar, unchanged).
  # The switches stop services; the node, npx and python3 runtimes that bash
  # and the public skills invoke are unaffected (checked). Measured on a
  # development host under gVisor
  # at one CPU: ready in 10.2 s and 238 MiB idle against 20.2 s and 1,209 MiB
  # for the full profile (README: "Slim services profile"). Each value must
  # stay the quoted string "true": the image's entrypoint compares strings,
  # and the harness types this mapping as text.
  environment:
    DISABLE_BROWSER: "true"
    DISABLE_JUPYTER: "true"
    DISABLE_CODE_SERVER: "true"
    DISABLE_VNC: "true"
    DISABLE_MCP_BROWSER: "true"
    DISABLE_NODEJS_REPL: "true"
  # Cold-start readiness budget, in seconds: the provider polls a new
  # sandbox's /v1/sandbox for this long and destroys it when the budget runs
  # out. At `--cpus 1` under gVisor the released full-profile image answered
  # after 80 to 91 seconds on the tenant VM class, so the harness default of
  # 60 destroyed every cold start; the slim profile measured about 15 s there
  # at one CPU and boots at two since 2026-09-17 (README: "Sandbox readiness
  # budget"). 120 is the initial
  # candidate the estate is evaluating, not a qualified fleet-wide bound; the
  # optional .env key SANDBOX_READY_TIMEOUT overrides it (60 to 600).
  ready_timeout: 120
  network:
    mode: allowlist
    approval: prompt
    temporary_grant_ttl: 300
    # Bounded on purpose: the package-installation set from
    # config.example.yaml and nothing else. Everything beyond installs goes
    # through the approval card per session; widening this standing list is
    # the operator's decision. web_search/web_fetch run from the Gateway and
    # are not governed by this list.
    allow_domains:
      - pypi.org
      - files.pythonhosted.org
      - registry.npmjs.org
      - github.com
    proxy_image: ghcr.io/altakleos/hartmesh-sandbox-network-proxy@sha256:982441e94143848a8c4d8fab477c0d3026ce9672dae63be9a0372f1da0cb9ee6

skills:
  # Skill library on the tenant data disk: public/ is mirrored from the
  # Gateway image at every start by gateway/run.sh (README: "Public skills"),
  # custom/ is the operator's. A chat's sandbox sees an immutable per-turn
  # snapshot under container_path/.accepted instead of this path (README:
  # "Public skills").
  path: /srv/hartmesh/home/skills
  container_path: /mnt/skills

database:
  backend: postgres
  postgres_url: $DATABASE_URL
  pool_recycle: 300
  command_timeout: 30

dedupe_storage:
  backend: auto

run_events:
  backend: db

# local_development is the self-migrating profile this single Gateway runs
# with. durable_production is also self-migrating but hard-requires the
# EXECUTION_POLICY_HMAC_KEYS / EXECUTION_POLICY_HMAC_ACTIVE_KEY_ID credentials,
# which are not in the .env contract; a nonempty skill snapshot also needs a
# qualified durable materializer, which this backend has none of (README:
# "Deployment profile").
deployment:
  profile: local_development
  readiness:
    capability_cache_seconds: 10.0
    admission_health_max_age_seconds: 10.0
    required_health_stale_seconds: 30.0
    capability_probe_timeout_seconds: 2.0
    overall_timeout_seconds: 5.0
    required_failure_threshold: 1
  shutdown:
    admission_seconds: 2.0
    channel_seconds: 5.0
    scheduler_seconds: 3.0
    run_seconds: 8.0
    dependencies_seconds: 5.0

# The LangGraph Store reads this legacy section and does not fall back to
# `database:`; point it at the same PostgreSQL so checkpoints survive restarts.
checkpointer:
  type: postgres
  connection_string: $DATABASE_URL

# URL comes from DEER_FLOW_STREAM_BRIDGE_REDIS_URL in the Gateway environment.
stream_bridge:
  type: redis

memory:
  storage_path: memory.json

verification:
  receipts_enabled: true
  receipts_render_mode: "delegation_only"
  judge_enabled: false
  judge_model_name: null

tool_plane:
  enabled: true
  policy_version: deerflow-default-v1
  allowed_mcp_transports: [stdio, sse, http, streamable_http]
  allowed_mcp_stdio_commands: [npx, uvx]
  allowed_mcp_endpoint_hosts: []
  allow_private_mcp_endpoints: false
  allowed_managed_integration_providers: []
  forbidden_skill_capabilities: []
  maximum_mcp_servers: 128
  maximum_skills: 512
  validation_requires_skill_review: true

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# Keyless defaults. A providers/tools fragment whose key is present replaces
# the entry with the same name (first fragment in file order wins), so a
# tenant with no search key still has web_search, web_fetch and image_search.
tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200
  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool
