# Included when GEMINI_API_KEY is present. From config.example.yaml (the
# native SDK entry; the OpenAI-compatible gateway variant needs an endpoint the
# contract cannot supply and is omitted).
env: GEMINI_API_KEY
models:
  - name: gemini-2.5-pro
    display_name: Gemini 2.5 Pro
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-2.5-pro
    gemini_api_key: $GEMINI_API_KEY
    timeout: 600.0
    max_retries: 2
    max_tokens: 8192
    context_window: 1048576
    supports_vision: true
