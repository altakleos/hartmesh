# Included when ZAI_API_KEY is present. From config.example.yaml.
env: ZAI_API_KEY
models:
  - name: glm-5.3-flash
    display_name: GLM-5.3-Flash
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: glm-5.3-flash
    api_base: https://api.z.ai/api/paas/v4
    api_key: $ZAI_API_KEY
    timeout: 600.0
    max_retries: 2
    temperature: 1.0
    top_p: 0.95
    max_tokens: 131072
    context_window: 1000000
    supports_thinking: true
    supports_reasoning_effort: false
    supports_vision: true
    stream_usage: false
    extra_body:
      thinking:
        type: enabled
        clear_thinking: true
      tool_stream: true
