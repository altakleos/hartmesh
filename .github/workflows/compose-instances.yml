name: Compose instances

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_image:
        description: Optional published backend digest for mounted bundle qualification
        type: string
      connections:
        description: Qualify signed connection images with explicit test config or the shipped default
        type: choice
        options: [skip, explicit, bundle-default]
        default: skip
      frontend_image:
        description: Signed frontend digest required for connection qualification
        type: string
      verify_shared_snapshots:
        description: Qualify ordinary and employee conversation sharing, continuation and recovery
        type: boolean
        default: false
      verify_agent_jobs:
        description: Exercise overlapping employee and ordinary jobs, company calls and interrupted final replies
        type: boolean
        default: false
      verify_file_browser:
        description: Qualify the managed workspace browser and a lost upload using both source-built or both signed images
        type: boolean
        default: false
      verify_home_rollback:
        description: Rehearse in-place Home rollback against the two supported older builds
        type: boolean
        default: false

concurrency:
  group: compose-instances-${{ github.event.pull_request.number || github.ref }}${{ inputs.verify_file_browser && '-file-browser' || '' }}${{ inputs.verify_shared_snapshots && '-shared-snapshots' || '' }}${{ inputs.verify_agent_jobs && '-agent-jobs' || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  bundle-instances:
    name: Storage and agents in the Compose bundle (Linux Docker)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ (inputs.verify_agent_jobs || inputs.verify_file_browser || inputs.verify_shared_snapshots || inputs.verify_home_rollback || (github.event_name == 'workflow_dispatch' && inputs.connections != 'skip')) && 110 || 60 }}
    env:
      C: docker compose --project-directory /opt/hartmesh --env-file /srv/hartmesh/.env
      EVIDENCE: ${{ github.workspace }}/bundle-evidence
    steps:
      - uses: actions/checkout@v6

      - name: Check employee job mode
        if: inputs.verify_agent_jobs
        env:
          OTHER_MODE: ${{ inputs.connections != 'skip' || inputs.verify_home_rollback || inputs.verify_file_browser || inputs.verify_shared_snapshots }}
          BACKEND: ${{ inputs.backend_image }}
          FRONTEND: ${{ inputs.frontend_image }}
        run: |
          test "$OTHER_MODE" = false
          test -n "$BACKEND" || test -z "$FRONTEND"

      - name: Check workspace browser mode
        if: github.event_name == 'workflow_dispatch' && inputs.verify_file_browser
        env:
          CONNECTIONS: ${{ inputs.connections }}
          HOME_ROLLBACK: ${{ inputs.verify_home_rollback }}
          BACKEND: ${{ inputs.backend_image }}
          FRONTEND: ${{ inputs.frontend_image }}
        run: |
          test "$CONNECTIONS" = skip && test "$HOME_ROLLBACK" = false
          test -n "$BACKEND" || test -z "$FRONTEND"

      - name: Check snapshot qualification mode
        if: github.event_name == 'workflow_dispatch' && inputs.verify_shared_snapshots
        env:
          CONNECTIONS: ${{ inputs.connections }}
          HOME_ROLLBACK: ${{ inputs.verify_home_rollback }}
          FILE_BROWSER: ${{ inputs.verify_file_browser }}
          FRONTEND: ${{ inputs.frontend_image }}
          BACKEND: ${{ inputs.backend_image }}
        run: |
          test "$CONNECTIONS" = skip && test "$HOME_ROLLBACK" = false && test "$FILE_BROWSER" = false && test -z "$FRONTEND"
          if [ -z "$BACKEND" ]; then
            echo "SNAPSHOT_BACKEND_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "SNAPSHOT_QUALIFICATION_MODE=source" >> "$GITHUB_ENV"
          fi

      - name: 1 Require Docker Engine 28 or later
        run: |
          version=$(docker version --format '{{.Server.Version}}')
          echo "Docker Engine $version; $(docker compose version)"
          test "${version%%.*}" -ge 28

      - name: 2 Free disk space and check the data directory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          TMPDIR="${RUNNER_TEMP}/hartmesh-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export TMPDIR
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          mkdir -p "$TMPDIR"
          case "$(findmnt -no FSTYPE --target "$TMPDIR")" in tmpfs|ramfs) echo "full-suite temporary directory must be disk-backed"; exit 1 ;; esac
          sudo mkdir -p /srv/hartmesh
          test "$(findmnt -no FSTYPE --target /srv/hartmesh)" = ext4
          test "$(findmnt -no PROPAGATION --target /srv/hartmesh)" = shared
          test "$(df --output=avail -BG /srv/hartmesh | tail -n 1 | tr -dc 0-9)" -ge 30
          command -v mkfs.ext4 e2fsck resize2fs losetup mount umount findmnt fallocate nsenter flock jq
          test -c /dev/loop-control
          test "$(uname -r | cut -d. -f1)" -ge 6

      - name: 3 Register the runtime alias hartmesh-ci
        run: |
          runc_path=$(command -v runc)
          sudo test -f /etc/docker/daemon.json || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq --arg path "$runc_path" '.runtimes["hartmesh-ci"] = {path: $path}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | jq -e 'has("hartmesh-ci")'
          test "$(docker info --format '{{.DefaultRuntime}}')" = runc

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"

      - name: 4 Prepare the backend test environment
        working-directory: backend
        run: uv sync --group dev

      - name: 5 Start the scripted model
        run: |
          mkdir -p "$EVIDENCE"
          # Gateway port checks run in its namespace; keep this host listener
          # outside the shipped sandbox's host-port allocation range.
          export HARTMESH_MODEL_BARRIER_DIR="$EVIDENCE"
          if [ "${{ inputs.verify_agent_jobs }}" = true ]; then
            nohup python3 docker/acceptance/job_provider.py > "$EVIDENCE/provider.log" 2>&1 &
          else
            nohup python3 -c 'from http.server import ThreadingHTTPServer; from runpy import run_path; ThreadingHTTPServer(("0.0.0.0", 18080), run_path("docker/acceptance/provider.py")["Handler"]).serve_forever()' > "$EVIDENCE/provider.log" 2>&1 &
          fi
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/health && break; sleep 0.5; done
          curl -fsS -o /dev/null http://127.0.0.1:18080/health

      - name: 6 Build the backend image from this commit
        if: inputs.backend_image == ''
        run: docker build --build-arg UV_EXTRAS=postgres --tag localhost:80/hartmesh-backend:ci --file backend/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .

      - name: Start the registry for locally built images
        if: inputs.backend_image == '' || inputs.verify_home_rollback
        run: |
          docker run -d --name ci-registry -p 127.0.0.1:80:5000 registry:2
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1/v2/ && break; sleep 0.5; done
          curl -fsS http://127.0.0.1/v2/

      - name: 7 Give the image a digest reference
        if: inputs.backend_image == ''
        run: |
          # The containerd image store takes a portless localhost for https, and plain http only with port 80 named.
          docker push localhost:80/hartmesh-backend:ci
          backend_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost:80/hartmesh-backend:ci)
          case "$backend_ref" in localhost:80/hartmesh-backend@sha256:*) ;; *) echo "unexpected reference: $backend_ref"; exit 1 ;; esac
          echo "BACKEND_REF=$backend_ref" >> "$GITHUB_ENV"
          docker run --rm --entrypoint sh "$backend_ref" -c 'set -eu; command -v nsenter; command -v setpriv; docker --version' > "$EVIDENCE/backend-tools.txt"
          cat "$EVIDENCE/backend-tools.txt"

      - name: Install crane for signed candidates
        if: github.event_name == 'workflow_dispatch' && (inputs.connections != 'skip' || ((inputs.verify_file_browser || inputs.verify_shared_snapshots || inputs.verify_agent_jobs) && inputs.backend_image != ''))
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Verify the signed snapshot backend
        if: github.event_name == 'workflow_dispatch' && inputs.verify_shared_snapshots && inputs.backend_image != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ inputs.backend_image }}
        run: |
          image=$(grep -Ex 'ghcr\.io/altakleos/hartmesh-backend@sha256:[0-9a-f]{64}' deploy/compose/images.txt)
          test "$BACKEND" = "$image" && grep -Fq "image: $image" deploy/compose/compose.yaml
          python3 scripts/release_artifacts.py verify-candidate --repository "$GITHUB_REPOSITORY" --version "$(jq -r .version frontend-hm/package.json)" --component backend --image "$image" --revision "$GITHUB_SHA"
          revision=$(crane config --platform linux/amd64 "$image" | jq -er '.config.Labels["org.opencontainers.image.revision"]')
          echo "SNAPSHOT_BACKEND_REVISION=$revision" >> "$GITHUB_ENV"
          echo "SNAPSHOT_QUALIFICATION_MODE=signed" >> "$GITHUB_ENV"
          frontend=$(grep -Ex 'ghcr\.io/altakleos/hartmesh-frontend@sha256:[0-9a-f]{64}' deploy/compose/images.txt)
          grep -Fq "image: $frontend" deploy/compose/compose.yaml
          python3 scripts/release_artifacts.py verify-candidate --repository "$GITHUB_REPOSITORY" --version "$(jq -r .version frontend-hm/package.json)" --component frontend --image "$frontend" --revision "$GITHUB_SHA"
          test "$(crane config --platform linux/amd64 "$frontend" | jq -er '.config.Labels["org.opencontainers.image.revision"]')" = "$revision"
          echo "SNAPSHOT_BROWSER_IMAGE=$frontend" >> "$GITHUB_ENV"
          cd backend
          uv sync --frozen --group dev --extra browser
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Verify connection candidate images
        if: github.event_name == 'workflow_dispatch' && inputs.connections != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ inputs.backend_image }}
          FRONTEND: ${{ inputs.frontend_image }}
          HOME_ROLLBACK: ${{ inputs.verify_home_rollback }}
        run: |
          test "$HOME_ROLLBACK" != true
          version=$(python3 -c 'import json; print(json.load(open("frontend-hm/package.json"))["version"])')
          for component in backend frontend; do
            case "$component" in backend) image="$BACKEND" ;; frontend) image="$FRONTEND" ;; esac
            [[ "$image" =~ ^ghcr\.io/altakleos/hartmesh-${component}@sha256:[0-9a-f]{64}$ ]]
            crane config --platform linux/amd64 "$image" | jq -e --arg head "$GITHUB_SHA" '.config.Labels["org.opencontainers.image.revision"] == $head'
            python3 scripts/release_artifacts.py verify-candidate --repository "$GITHUB_REPOSITORY" \
              --component "$component" --version "$version" --image "$image" --revision "$GITHUB_SHA"
          done
          docker pull "$FRONTEND"
          echo "HARTMESH_BROWSER_FRONTEND=$FRONTEND" >> "$GITHUB_ENV"

      - name: Verify the signed workspace browser pair
        if: github.event_name == 'workflow_dispatch' && (inputs.verify_file_browser || inputs.verify_agent_jobs) && inputs.backend_image != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ inputs.backend_image }}
          FRONTEND_HINT: ${{ inputs.frontend_image }}
        run: |
          version=$(jq -r .version frontend-hm/package.json)
          for component in backend frontend; do
            image=$(grep -Ex "ghcr\.io/altakleos/hartmesh-${component}@sha256:[0-9a-f]{64}" deploy/compose/images.txt)
            test "$(grep -Ec "image: ${image}$" deploy/compose/compose.yaml)" -ge 1
            if [ "$component" = backend ]; then test "$BACKEND" = "$image"; else test -z "$FRONTEND_HINT" || test "$FRONTEND_HINT" = "$image"; fi
            python3 scripts/release_artifacts.py verify-candidate --repository "$GITHUB_REPOSITORY" --version "$version" --component "$component" --image "$image" --revision "$GITHUB_SHA"
            revision=$(crane config --platform linux/amd64 "$image" | jq -er '.config.Labels["org.opencontainers.image.revision"]')
            if [ "$component" = backend ]; then
              common="$revision"
            else
              test "$revision" = "$common"
              echo "HARTMESH_BROWSER_FRONTEND=$image" >> "$GITHUB_ENV"
            fi
          done
          echo "FILES_BROWSER_REVISION=$common" >> "$GITHUB_ENV"
          cd backend
          uv sync --frozen --group dev --extra browser
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Use the requested backend candidate
        if: inputs.backend_image != ''
        env:
          CANDIDATE: ${{ inputs.backend_image }}
        run: |
          [[ "$CANDIDATE" =~ ^ghcr\.io/altakleos/hartmesh-backend@sha256:[0-9a-f]{64}$ ]]
          docker pull "$CANDIDATE"
          echo "BACKEND_REF=$CANDIDATE" >> "$GITHUB_ENV"
          docker run --rm --entrypoint sh "$CANDIDATE" -c 'set -eu; command -v nsenter; command -v setpriv; docker --version' > "$EVIDENCE/backend-tools.txt"

      - name: 8 Install the bundle at /opt/hartmesh with the built image
        run: |
          sudo mkdir -p /opt/hartmesh
          sudo cp -R deploy/compose/. /opt/hartmesh/
          sudo find /opt/hartmesh -type d -exec chmod 0755 {} +
          sudo find /opt/hartmesh -type f -exec chmod 0644 {} +
          sudo sed -i -E "s#ghcr\.io/altakleos/hartmesh-backend@sha256:[0-9a-f]{64}#${BACKEND_REF}#g" /opt/hartmesh/compose.yaml /opt/hartmesh/images.txt
          test "$(grep -c -F "$BACKEND_REF" /opt/hartmesh/compose.yaml)" = 3

      - name: Build the candidate product UI and install its browser rehearsal
        if: github.event_name == 'workflow_dispatch' && (inputs.verify_home_rollback || ((inputs.verify_file_browser || inputs.verify_agent_jobs) && inputs.backend_image == ''))
        run: |
          docker build --target prod --tag localhost:80/hartmesh-frontend:ci --file frontend-hm/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
          docker push localhost:80/hartmesh-frontend:ci
          frontend_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost:80/hartmesh-frontend:ci)
          case "$frontend_ref" in localhost:80/hartmesh-frontend@sha256:*) ;; *) exit 1 ;; esac
          sudo sed -i -E "s#ghcr\.io/altakleos/hartmesh-frontend@sha256:[0-9a-f]{64}#${frontend_ref}#g" /opt/hartmesh/compose.yaml /opt/hartmesh/images.txt
          test "$(grep -c -F "$frontend_ref" /opt/hartmesh/compose.yaml)" = 1
          echo "HARTMESH_BROWSER_FRONTEND=$frontend_ref" >> "$GITHUB_ENV"
          echo "FILES_BROWSER_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          cd backend
          uv sync --frozen --group dev --extra browser
          .venv/bin/python -m playwright install --with-deps chromium

      - name: 9 Write the data directory, the model file and the .env contract
        run: |
          sudo install -d -o 1000 -g 1000 -m 0750 /srv/hartmesh/postgres /srv/hartmesh/redis /srv/hartmesh/home /srv/hartmesh/uploads /srv/hartmesh/artifacts
          sudo install -d -m 0755 /srv/hartmesh/operator /srv/hartmesh/operator/tenant
          sudo tee /srv/hartmesh/operator/models.yaml >/dev/null <<'YAML'
          models:
            - name: acceptance-model
              display_name: Acceptance Model
              use: langchain_openai:ChatOpenAI
              model: acceptance-model
              api_key: $ACCEPTANCE_API_KEY
              base_url: http://host.docker.internal:18080/v1
              max_retries: 0
              timeout: 200
          YAML
          sudo tee /srv/hartmesh/.env >/dev/null <<'ENV'
          HARTMESH_TENANT=ci
          HARTMESH_PUBLIC_HOST=localhost
          HARTMESH_TRUSTED_PROXIES=127.0.0.1
          HARTMESH_LISTEN=127.0.0.1:2026
          HARTMESH_DATA_DIR=/srv/hartmesh
          SANDBOX_RUNTIME=hartmesh-ci
          SANDBOX_EGRESS=allowlist
          POSTGRES_PASSWORD=ci-postgres-password
          REDIS_PASSWORD=ci-redis-password
          AUTH_JWT_SECRET=ci-session-signing-secret-of-at-least-32-characters
          HARTMESH_LOCAL_PASSWORDS=allowed
          HARTMESH_LOCAL_REGISTRATION=open
          HARTMESH_MODELS_FILE=/srv/hartmesh/operator/models.yaml
          ACCEPTANCE_API_KEY=synthetic-local-only
          HARTMESH_USERS=3
          HARTMESH_USER_STORAGE_GIB=1
          HARTMESH_AI_ASSISTANTS_PER_USER=1
          HARTMESH_AI_ASSISTANT_STORAGE_GIB=1
          HARTMESH_AI_EMPLOYEES=2
          HARTMESH_AI_EMPLOYEE_STORAGE_GIB=1
          HARTMESH_COMPANY_STORAGE_GIB=1
          ENV
          sudo chmod 0644 /srv/hartmesh/.env /srv/hartmesh/operator/models.yaml

      - name: Install the connection qualification fixture
        if: github.event_name == 'workflow_dispatch' && (inputs.connections != 'skip' || inputs.verify_agent_jobs)
        env:
          ACTIVATION: ${{ inputs.connections }}
          SOURCE_JOB_REVISION: ${{ inputs.verify_agent_jobs && inputs.backend_image == '' && github.sha || '' }}
        run: |
          sudo sed -i -E "s#ghcr.io/altakleos/hartmesh-frontend@sha256:[0-9a-f]{64}#${HARTMESH_BROWSER_FRONTEND}#g" /opt/hartmesh/compose.yaml /opt/hartmesh/images.txt
          test "$(grep -c -F "$HARTMESH_BROWSER_FRONTEND" /opt/hartmesh/compose.yaml)" = 1
          bash docker/acceptance/connections/tls.sh "$BACKEND_REF" /opt/hartmesh
          sudo install -m 0644 docker/acceptance/connections/compose.yaml /opt/hartmesh/connections.yaml
          sudo install -m 0644 docker/acceptance/connections/notice_service.py /opt/hartmesh/notice_service.py
          echo 'HARTMESH_PRIVATE_ENDPOINTS=notices-a.example.test:8080,notices-b.example.test:8080' | sudo tee -a /srv/hartmesh/.env >/dev/null
          if [ "${{ inputs.verify_agent_jobs }}" = true ]; then
            echo 'HARTMESH_BATCHES=on' | sudo tee -a /srv/hartmesh/.env >/dev/null
          fi
          if [ "$ACTIVATION" = explicit ]; then
            # Prior to default activation, supply just this option in the disposable operator template.
            sudo backend/.venv/bin/python docker/acceptance/connections/template.py on
            echo 'HARTMESH_AGENT_CONNECTIONS=on' | sudo tee -a /srv/hartmesh/.env >/dev/null
          fi
          cd backend
          uv sync --frozen --group dev --extra browser
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Prefetch every pinned bundle image
        run: |
          while IFS= read -r image; do
            case "$image" in *@sha256:*) ;; *) echo "bundle image is not digest-pinned: $image"; exit 1 ;; esac
            docker pull "$image"
          done < /opt/hartmesh/images.txt

      - name: 10 Ask the shipped one-shot whether the keys fit, before anything exists
        run: |
          $C pull --quiet
          $C run --rm -T storage-init status | tee "$EVIDENCE/status-before.json"
          tail -n 1 "$EVIDENCE/status-before.json" | jq -e '.command == "status" and .returncode == 0 and .inventory == false and (.spaces | length) == 0 and .fits == true and .data_disk.propagation == "shared" and .required_bytes == 9663676416 and .plan.user.count == 3 and .plan.assistant.count == 3 and .plan.employee.count == 2 and .plan.company.count == 1'

      - name: 11 Start the bundle, whose first start prepares every Space
        run: |
          trap '$C logs --no-color gateway storage-init >&2 || true' ERR
          $C up -d --wait
          test "$(docker inspect --format '{{.State.Health.Status}}' hartmesh-gateway-1)" = healthy
          test "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' hartmesh-storage-init-1)" = "exited 0"
          $C logs --no-log-prefix storage-init > "$EVIDENCE/storage-init.log" 2>&1
          test "$(grep -c '^storage-init: prepared ' "$EVIDENCE/storage-init.log")" = 9
          tail -n 1 "$EVIDENCE/storage-init.log" | jq -e '.command == "prepare" and .returncode == 0 and .verdict == "complete" and .fits == true and .prepared == {"user": 3, "assistant": 3, "employee": 2, "company": 1} and .prepared_now == .prepared and (.missing | add) == 0 and (.spaces | length) == 9 and .fstab.entries == 9 and (.problems | length) == 0'
          sudo jq -e '.schema_version == 2 and ([.volumes[].kind] | sort) == ["assistant", "assistant", "assistant", "company", "employee", "employee", "user", "user", "user"] and all(.volumes[]; .max_bytes == 1073741824 and .max_inodes == 131072)' /srv/hartmesh/spaces/inventory.v2.json
          test "$(sudo stat -c '%U:%g %a' /srv/hartmesh/spaces)" = "root:1000 750"
          test "$(sudo stat -c '%u:%g %a' /srv/hartmesh/spaces/inventory.v2.json)" = "1000:1000 440"
          test "$(findmnt -rn -o TARGET | grep -c '^/srv/hartmesh/spaces/.*\.volume$')" = 9
          test "$(sed -n '/^# hartmesh-storage begin$/,/^# hartmesh-storage end$/p' /etc/fstab | grep -c '\.img ')" = 9
          test "$($C exec -T --user 1000:1000 gateway grep -c ' /srv/hartmesh/spaces/' /proc/self/mountinfo)" = 9
          $C logs --no-log-prefix gateway > "$EVIDENCE/gateway-start.log" 2>&1
          grep -F 'storage: storage-init mount-all exit 0 in ' "$EVIDENCE/gateway-start.log" | grep -F '(9 spaces: 0 mounted now, 9 already mounted, 0 failed)'
          grep -F 'storage: ready (9 spaces prepared, 9 verified; users 0 of 3 seats' "$EVIDENCE/gateway-start.log" | grep -F 'runtime hartmesh-ci)'
          grep -F 'storage: company space created (' "$EVIDENCE/gateway-start.log"
          # nginx 301s a GET on 127.0.0.1 to localhost (#6156); ask the canonical host.
          curl -fsS http://localhost:2026/health | jq -e '.storage == "ready" and (.agents == "none" or .agents == "ready")'
          test "$($C exec -T gateway id -u):$($C exec -T --user 1000 gateway id -u):$($C exec -T --user 1000 gateway id -g)" = "0:1000:0"

      - name: 12 Run prepare by hand, which finds nothing to do
        run: |
          $C run --rm -T storage-init prepare | tee "$EVIDENCE/prepare-again.json"
          tail -n 1 "$EVIDENCE/prepare-again.json" | jq -e '.command == "prepare" and .returncode == 0 and .verdict == "nothing-to-do" and (.prepared_now | add) == 0 and .prepared == {"user": 3, "assistant": 3, "employee": 2, "company": 1} and .fstab.changed == false and (.problems | length) == 0'

      - name: 13 Run the acceptance tests
        if: github.event_name != 'workflow_dispatch' || (inputs.connections == 'skip' && !inputs.verify_file_browser && !inputs.verify_shared_snapshots && !inputs.verify_agent_jobs)
        working-directory: backend
        run: |
          env PYTHONPATH="$PWD" PYTHON_DOTENV_DISABLED=1 \
            HARTMESH_REQUIRE_BUNDLE_INSTANCES=1 \
            HARTMESH_BUNDLE_URL=http://localhost:2026 \
            HARTMESH_BUNDLE_PROJECT_DIR=/opt/hartmesh \
            HARTMESH_BUNDLE_ENV_FILE=/srv/hartmesh/.env \
            HARTMESH_BUNDLE_ADMIN_EMAIL=admin@example.com \
            HARTMESH_BUNDLE_ADMIN_PASSWORD='Acceptance-Admin-2026!' \
            HARTMESH_BUNDLE_RUNTIME=hartmesh-ci \
            "$PWD/.venv/bin/python" -m pytest tests/test_compose_instance_acceptance.py \
            --maxfail=1 -q --tb=short -p no:randomly --basetemp="$TMPDIR/fixtures" --junitxml="$EVIDENCE/acceptance.xml"
          python - "$EVIDENCE/acceptance.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          cases = tree.findall(".//testcase")
          assert len(cases) == 27, f"expected 27 acceptance cases, collected {len(cases)}"
          expected = (
              'test_pool_verifies_inside_the_gateway_container_without_host_image_path',
              'test_ordinary_chat_works_with_storage_spaces_on',
              'test_my_files_shared_and_projects_work_with_storage_spaces_on',
              'test_chat_without_files_mounts_nothing_of_the_user',
              'test_chat_without_shared_mounts_the_users_space_alone',
              'test_seat_is_taken_at_the_three_creation_paths_and_refused_past_the_count',
