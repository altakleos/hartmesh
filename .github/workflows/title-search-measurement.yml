name: Title search measurement

on:
  pull_request:
    paths:
      - ".github/workflows/title-search-measurement.yml"
      - "scripts/docker_acceptance.py"
      - "docker/acceptance/compose.yaml"
      - "docker/acceptance/compose.postgres-redis.yaml"
      - "docker/acceptance/acceptance-config.yaml"
      - "docker/acceptance/title-search/**"
      - "frontend-hm/src/components/workspace/conversation-title-results.tsx"
      - "frontend-hm/src/app/workspace/chats/page.tsx"
      - "frontend-hm/tests/e2e-title-search-measurement/**"
      - "frontend-hm/playwright.title-search-measurement.config.ts"
      - "backend/app/gateway/search_corpus.py"
      - "backend/app/gateway/routers/search.py"
  workflow_dispatch:
    inputs:
      backend_image:
        description: Candidate backend repository@sha256:digest
        required: true
        type: string
      frontend_image:
        description: Candidate frontend repository@sha256:digest
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  measure:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install crane
        if: github.event_name == 'workflow_dispatch'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Prepare headless browser
        working-directory: frontend-hm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps
      - name: Measure source build
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/docker_acceptance.py --measure-titles --stores postgres-redis \
            --artifacts "$RUNNER_TEMP/title-search"
      - name: Measure release candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "${BACKEND_IMAGE%@*}" == "$prefix-backend" ]]
          [[ "${FRONTEND_IMAGE%@*}" == "$prefix-frontend" ]]
          python3 scripts/docker_acceptance.py --measure-titles --stores postgres-redis \
            --backend-image "$BACKEND_IMAGE" --frontend-image "$FRONTEND_IMAGE" \
            --artifacts "$RUNNER_TEMP/title-search"
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: title-search-measurement-${{ github.run_attempt }}
          path: ${{ runner.temp }}/title-search
          if-no-files-found: error
          retention-days: 90
