[project]
name = "hartmesh-work-proposals"
version = "0.1.0"
description = "Employee proposals for tracked assignments"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.14,<0.3"]

[project.entry-points."deerflow.extensions"]
work-proposals = "hartmesh_work_proposals:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hartmesh_work_proposals"]
