name: Record Release Manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example, 2.1.0+hartmesh.1)
        required: true
        type: string
      sandbox:
        description: Optional digest-pinned sandbox image reference to include in the manifest
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the optional sandbox reference
        id: sandbox
        env:
          SANDBOX: ${{ inputs.sandbox }}
        run: |
          set -euo pipefail
          if [ -z "$SANDBOX" ]; then
            printf 'present=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$SANDBOX" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::sandbox must end with @sha256:<64 lowercase hex characters>"
            exit 1
          fi
          printf 'present=true\n' >> "$GITHUB_OUTPUT"
          printf 'repository=%s\n' "${SANDBOX%@*}" >> "$GITHUB_OUTPUT"
          printf 'expected_digest=%s\n' "${SANDBOX##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Compute immutable release references
        id: identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/release_tag_spellings.sh "$VERSION" >> "$GITHUB_OUTPUT"
          COMMIT="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT:0:7}"
          printf 'commit=%s\n' "$COMMIT" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate registry clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve and cross-check published artifacts
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY_PATH: ${{ github.repository }}
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
          SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
          CHART_OCI_TAG: ${{ steps.identity.outputs.chart_oci_tag }}
          SANDBOX: ${{ inputs.sandbox }}
          SANDBOX_PRESENT: ${{ steps.sandbox.outputs.present }}
          SANDBOX_EXPECTED_DIGEST: ${{ steps.sandbox.outputs.expected_digest }}
          SANDBOX_REPOSITORY: ${{ steps.sandbox.outputs.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPOSITORY_PATH%%/*}"
          CHART_REPOSITORY="oci://ghcr.io/${OWNER}/charts/deer-flow"

          assert_digest() {
            if ! printf '%s' "$2" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::$1 did not resolve to a sha256 digest"
              exit 1
            fi
          }

          for COMPONENT in backend frontend provisioner; do
            IMAGE_REPOSITORY="${IMAGE_BASE}-${COMPONENT}"
            TAG_REFERENCE="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
            SHA_REFERENCE="${IMAGE_REPOSITORY}:sha-${SHORT_SHA}"
            TAG_DIGEST="$(crane digest "$TAG_REFERENCE")"
            assert_digest "${COMPONENT} release tag" "$TAG_DIGEST"
            if SHA_DIGEST="$(crane digest "$SHA_REFERENCE" 2>/dev/null)"; then
              assert_digest "${COMPONENT} sha tag" "$SHA_DIGEST"
              if [ "$TAG_DIGEST" != "$SHA_DIGEST" ]; then
                echo "::error::${TAG_REFERENCE} does not match ${SHA_REFERENCE}"
                exit 1
              fi
              REVISION_CHECK="verified"
            else
              TAG_LIST_FILE="${RUNNER_TEMP}/${COMPONENT}-tags.txt"
              if ! crane ls "$IMAGE_REPOSITORY" > "$TAG_LIST_FILE"; then
                echo "::error::Unable to confirm whether ${SHA_REFERENCE} exists because ${IMAGE_REPOSITORY} tags could not be listed"
                exit 1
              fi
              if grep -Fxq "sha-${SHORT_SHA}" "$TAG_LIST_FILE"; then
                echo "::error::${SHA_REFERENCE} is listed but its digest could not be resolved"
                exit 1
              fi
              echo "::warning::${SHA_REFERENCE} was not found; recording ${TAG_REFERENCE} as the published identity"
              echo "::warning::First 50 tags currently present in ${IMAGE_REPOSITORY}:"
              head -50 "$TAG_LIST_FILE"
              REVISION_CHECK="tag-not-found"
            fi
            printf '%s_repository=%s\n' "$COMPONENT" "$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
            printf '%s_digest=%s\n' "$COMPONENT" "$TAG_DIGEST" >> "$GITHUB_OUTPUT"
            printf '%s_revision_check=%s\n' "$COMPONENT" "$REVISION_CHECK" >> "$GITHUB_OUTPUT"
          done

          if [ "$SANDBOX_PRESENT" = "true" ]; then
            SANDBOX_DIGEST="$(crane digest "$SANDBOX")"
            assert_digest "sandbox image" "$SANDBOX_DIGEST"
            if [ "$SANDBOX_DIGEST" != "$SANDBOX_EXPECTED_DIGEST" ]; then
              echo "::error::sandbox reference resolved to ${SANDBOX_DIGEST}, expected ${SANDBOX_EXPECTED_DIGEST}"
              exit 1
            fi
            printf 'sandbox_repository=%s\n' "$SANDBOX_REPOSITORY" >> "$GITHUB_OUTPUT"
            printf 'sandbox_digest=%s\n' "$SANDBOX_DIGEST" >> "$GITHUB_OUTPUT"
          fi

          CHART_MANIFEST_DIGEST="$(crane digest "ghcr.io/${OWNER}/charts/deer-flow:${CHART_OCI_TAG}")"
          assert_digest "chart OCI tag" "$CHART_MANIFEST_DIGEST"
          CHART_DIRECTORY="$RUNNER_TEMP/release-chart"
          mkdir --parents "$CHART_DIRECTORY"
          helm pull "$CHART_REPOSITORY" --version "$VERSION" --destination "$CHART_DIRECTORY"
          CHART_PACKAGE="$CHART_DIRECTORY/deer-flow-${VERSION}.tgz"
          if [ ! -f "$CHART_PACKAGE" ]; then
            echo "::error::helm pull did not produce $CHART_PACKAGE"
            exit 1
          fi
          if ! tar -xzOf "$CHART_PACKAGE" deer-flow/Chart.yaml | grep -Fx "version: ${VERSION}" >/dev/null; then
            echo "::error::pulled chart $CHART_PACKAGE does not declare requested version $VERSION"
            exit 1
          fi
          PACKAGE_SHA256="$(sha256sum "$CHART_PACKAGE" | awk '{print $1}')"
          printf 'chart_repository=%s\n' "$CHART_REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'chart_manifest_digest=%s\n' "$CHART_MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'package_sha256=%s\n' "$PACKAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Write release-manifest.json
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          IMAGE_TAG: ${{ steps.identity.outputs.image_tag }}
          CHART_OCI_TAG: ${{ steps.identity.outputs.chart_oci_tag }}
          BACKEND_REPOSITORY: ${{ steps.resolve.outputs.backend_repository }}
          BACKEND_DIGEST: ${{ steps.resolve.outputs.backend_digest }}
          BACKEND_REVISION_CHECK: ${{ steps.resolve.outputs.backend_revision_check }}
          FRONTEND_REPOSITORY: ${{ steps.resolve.outputs.frontend_repository }}
          FRONTEND_DIGEST: ${{ steps.resolve.outputs.frontend_digest }}
          FRONTEND_REVISION_CHECK: ${{ steps.resolve.outputs.frontend_revision_check }}
          PROVISIONER_REPOSITORY: ${{ steps.resolve.outputs.provisioner_repository }}
          PROVISIONER_DIGEST: ${{ steps.resolve.outputs.provisioner_digest }}
          PROVISIONER_REVISION_CHECK: ${{ steps.resolve.outputs.provisioner_revision_check }}
          CHART_REPOSITORY: ${{ steps.resolve.outputs.chart_repository }}
          CHART_MANIFEST_DIGEST: ${{ steps.resolve.outputs.chart_manifest_digest }}
          PACKAGE_SHA256: ${{ steps.resolve.outputs.package_sha256 }}
          SANDBOX_PRESENT: ${{ steps.sandbox.outputs.present }}
          SANDBOX_REPOSITORY: ${{ steps.resolve.outputs.sandbox_repository }}
          SANDBOX_DIGEST: ${{ steps.resolve.outputs.sandbox_digest }}
        run: |
          python3 - <<'PY'
          import json
          import os

          image_tag = os.environ["IMAGE_TAG"]
          manifest = {
              "schema": 1,
              "version": os.environ["VERSION"],
              "tag": f"v{os.environ['VERSION']}",
              "commit": os.environ["COMMIT"],
              "images": {
                  name: {
                      "repository": os.environ[f"{name.upper()}_REPOSITORY"],
                      "tag": image_tag,
                      "digest": os.environ[f"{name.upper()}_DIGEST"],
                      "revision_check": os.environ[f"{name.upper()}_REVISION_CHECK"],
                  }
                  for name in ("backend", "frontend", "provisioner")
              },
              "chart": {
                  "repository": os.environ["CHART_REPOSITORY"],
                  "version": os.environ["VERSION"],
                  "oci_tag": os.environ["CHART_OCI_TAG"],
                  "manifest_digest": os.environ["CHART_MANIFEST_DIGEST"],
                  "package_sha256": os.environ["PACKAGE_SHA256"],
              },
          }
          if os.environ["SANDBOX_PRESENT"] == "true":
              manifest["sandbox"] = {
                  "repository": os.environ["SANDBOX_REPOSITORY"],
                  "digest": os.environ["SANDBOX_DIGEST"],
              }
          with open("release-manifest.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, indent=2)
              output.write("\n")
          PY

      - name: Upload manifest workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ inputs.version }}
          path: release-manifest.json
          if-no-files-found: error

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --notes "see CHANGELOG.md"
          fi
          gh release upload "$TAG" release-manifest.json --clobber

      - name: Summarize resolved digests
        run: |
          {
            echo "### Release artifact digests"
            echo "| Artifact | Pinned identity | Revision check |"
            echo "| --- | --- | --- |"
            echo '| backend | `${{ steps.resolve.outputs.backend_repository }}@${{ steps.resolve.outputs.backend_digest }}` | `${{ steps.resolve.outputs.backend_revision_check }}` |'
            echo '| frontend | `${{ steps.resolve.outputs.frontend_repository }}@${{ steps.resolve.outputs.frontend_digest }}` | `${{ steps.resolve.outputs.frontend_revision_check }}` |'
            echo '| provisioner | `${{ steps.resolve.outputs.provisioner_repository }}@${{ steps.resolve.outputs.provisioner_digest }}` | `${{ steps.resolve.outputs.provisioner_revision_check }}` |'
            if [ '${{ steps.sandbox.outputs.present }}' = 'true' ]; then
              echo '| sandbox | `${{ steps.resolve.outputs.sandbox_repository }}@${{ steps.resolve.outputs.sandbox_digest }}` | provided digest verified |'
            fi
            echo '| chart manifest | `${{ steps.resolve.outputs.chart_manifest_digest }}` | n/a |'
            echo '| chart package SHA-256 | `${{ steps.resolve.outputs.package_sha256 }}` | n/a |'
          } >> "$GITHUB_STEP_SUMMARY"
