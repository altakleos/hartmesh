# Included when CRW_API_KEY is present (fastCRW cloud); replaces web_search and web_fetch.
env: CRW_API_KEY
tools:
  - name: web_search
    group: web
    use: deerflow.community.fastcrw.tools:web_search_tool
    max_results: 5
    api_key: $CRW_API_KEY
  - name: web_fetch
    group: web
    use: deerflow.community.fastcrw.tools:web_fetch_tool
    api_key: $CRW_API_KEY
