# Included when SERPER_API_KEY is present; replaces web_search and image_search.
env: SERPER_API_KEY
tools:
  - name: web_search
    group: web
    use: deerflow.community.serper.tools:web_search_tool
    max_results: 5
    api_key: $SERPER_API_KEY
  - name: image_search
    group: web
    use: deerflow.community.serper.tools:image_search_tool
    max_results: 5
    api_key: $SERPER_API_KEY
