[project]
name = "deerflow-extension-work-input"
version = "0.1.0"
description = "Optional human quote response using the generic Work input facade"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.7,<0.3"]

[project.entry-points."deerflow.extensions"]
work-input = "deerflow_extension_work_input:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_work_input"]
