name: Verify Versions

# Reusable workflow: checks that every project version source agrees with the
# git tag that triggered the release, or with an explicitly passed version for
# a candidate build dispatched before the tag exists. Called by chart.yaml and
# container.yaml on v* tags so a forgotten version bump blocks the entire
# release (container images + chart), not just the chart.
#
# Sources verified: deploy/helm/deer-flow/Chart.yaml (version + appVersion),
# backend/pyproject.toml, frontend-hm/package.json, and backend/uv.lock (compared, then
# `uv lock --check`, which the backend image's `uv sync --locked` depends on).
# Logic lives in scripts/verify_versions.sh so it can also be run locally.

on:
  workflow_call:
    inputs:
      version:
        description: Release version to verify against; empty derives it from the v* tag that triggered the caller
        required: false
        type: string
        default: ""

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Verify all version sources match tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          TAG_VERSION="${TAG_VERSION#v}"
          bash scripts/verify_versions.sh "$TAG_VERSION"
