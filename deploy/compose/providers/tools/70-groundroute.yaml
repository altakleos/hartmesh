# Included when GROUNDROUTE_API_KEY is present; replaces web_search and web_fetch.
env: GROUNDROUTE_API_KEY
tools:
  - name: web_search
    group: web
    use: deerflow.community.groundroute.tools:web_search_tool
    max_results: 5
    api_key: $GROUNDROUTE_API_KEY
  - name: web_fetch
    group: web
    use: deerflow.community.groundroute.tools:web_fetch_tool
    api_key: $GROUNDROUTE_API_KEY
