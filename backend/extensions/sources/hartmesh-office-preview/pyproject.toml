[project]
name = "hartmesh-office-preview"
version = "0.1.0"
description = "Read-only Office document presentations"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.5,<0.3"]

[project.entry-points."deerflow.extensions"]
office-preview = "hartmesh_office_preview:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hartmesh_office_preview"]
