# Included when VOLCENGINE_API_KEY is present. From config.example.yaml:
# Doubao plus the two Coding Plan entries that share the same key.
env: VOLCENGINE_API_KEY
models:
  - name: doubao-seed-1.8
    display_name: Doubao-Seed-1.8
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: doubao-seed-1-8-251228
    api_base: https://ark.cn-beijing.volces.com/api/v3
    api_key: $VOLCENGINE_API_KEY
    timeout: 600.0
    max_retries: 2
    context_window: 262144
    supports_thinking: true
    supports_vision: true
    supports_reasoning_effort: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled
  - name: glm-5.2-cp
    display_name: GLM-5.2 (Coding Plan)
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: glm-5.2
    api_base: https://ark.cn-beijing.volces.com/api/coding/v3
    api_key: $VOLCENGINE_API_KEY
    timeout: 600.0
    max_retries: 2
    supports_thinking: true
    supports_vision: false
    supports_reasoning_effort: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled
  - name: deepseek-v4-pro-cp
    display_name: DeepSeek-V4-Pro (Coding Plan)
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: deepseek-v4-pro
    api_base: https://ark.cn-beijing.volces.com/api/coding/v3
    api_key: $VOLCENGINE_API_KEY
    timeout: 600.0
    max_retries: 2
    supports_thinking: true
    supports_vision: false
    supports_reasoning_effort: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled
